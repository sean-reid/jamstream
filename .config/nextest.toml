# nextest reads this on every path the tests run on: ci.yml, nightly.yml, and a
# laptop. That is the whole reason the file exists. Both facts below were
# command-line arguments in one workflow, which made them true in one place and
# false in the two that mattered.
#
# Everything here is per-test rather than profile-wide. `test(=name)` is an
# exact match, so a rename silently drops the override, and a filter that
# selects nothing is not an error to nextest. Two checks hold the pairing: each
# measuring suite keeps a `the_measured_tests_are_named_in_the_nextest_config`
# naming what it publishes, and the server's local_provider suite runs the other
# way in `every_test_the_nextest_config_names_is_claimed_by_its_suite`, so a name
# added here without a function behind it fails rather than doing nothing.

# `priority` below needs 0.9.91 or newer. Without this line an older binary
# refuses the key outright, which is fine, but the message names a toml field
# rather than a version; with it the error says what to upgrade.
nextest-version = { required = "0.9.91" }

[test-groups]
# Everything that spawns target/<profile>/jamstreamd, one at a time, because
# that path is a file cargo rewrites mid-run. The cli and client local-mode
# suites run `cargo build -p jamstream-server` at test start (CARGO_BIN_EXE_
# does not cover another package's binary), and cargo re-uplifts the binary on
# every invocation, even a fully fresh no-op build; on Windows the uplift is a
# whole-file copy, not a hardlink. The server suites spawn the same path, and
# CreateProcess on a half-copied image fails with error 216,
# ERROR_EXE_MACHINE_TYPE_MISMATCH, which is how #354's windows leg found this.
# One test at a time means a rewrite can never overlap a spawn. Grouped by
# binary rather than by test name so a renamed test cannot silently leave.
jamstreamd-uplift = { max-threads = 1 }

# The two suites that run a real ffmpeg, one at a time. Each of them encodes
# 720p30 at real time and asserts that not one frame was dropped or repeated,
# which is a claim about a machine with a core to spare; two of them at once on
# a shared runner is not that machine. relay_chain also binds 127.0.0.1:1935,
# the address the product uses, and it refuses to judge a relay it did not
# start, so it cannot overlap anything else holding that port.
real-encoder = { max-threads = 1 }

[[profile.default.overrides]]
# The tests that read a wall clock go last and get the machine to themselves.
#
# Almost every other test in these suites is a cpu-bound simulation and nextest
# runs as many at once as the machine has cores, so a gate measured beside them
# is measured on a machine with no idle core left. A p99 across a 600 us region
# does not survive that: lose the cpu once inside the region and the sample
# records a scheduler quantum instead of a tick, and a p99 over 1000 ticks needs
# ten such samples to move.
#
# The numbers, from #276 and #282. windows-latest reported the broadcast tick at
# p99 19251 us against a 1213 us median and a 10000 us budget, on a
# comments-only change. Given the runner to itself the same platform measures
# p99 1042 to 1092 us against a 705 to 895 us median. On a 14-core laptop the
# shape reproduces on demand: p99 684 us idle, p99 9725 us against 14 busy
# cores, median 601 us to 946 us. The median moves 1.6x and the tail moves 14x,
# which is what preemption looks like and not what tick cost looks like. No
# budget on any platform was widened for it.
#
# "num-test-threads" reserves the whole pool, so nextest waits for everything
# else to finish and starts nothing beside these. The priority is what makes
# that affordable, and the difference is measured on this workspace's 965 tests
# on a 14-core laptop: 47 s with no isolation at all, 86 s isolated at the
# default priority, 56 s isolated and last. An exclusive test reserves the pool
# wherever the scheduler reaches it, so at the default priority each of the
# three drains the machine mid-run and leaves it idle waiting; last in the queue
# is one drain at the end instead of three in the middle. That is the same shape
# #282 got from a second workflow step, and it costs 9 s.
filter = """
    test(=tick_budget_at_capacity)
    or test(=perf_sanity_sixty_seconds_regional)
    or test(=tick_cost_at_capacity)
"""
priority = -100
threads-required = "num-test-threads"
success-output = "immediate"

[[profile.default.overrides]]
# The measurements that are facts about the code rather than about the machine:
# mouth-to-ear latency and buffer depth off the virtual clock, bytes counted on
# the simulated network, jitter counters through a capture gap, and allocations
# per frame off a counting allocator. Contention cannot move any of them, so
# they only need publishing. The allocation count is the tightest gate in the
# workspace at 79 percent of its budget and was the one being thrown away.
#
# Publishing is not the default because `success-output = "immediate"` prints
# libtest's own six lines of preamble for every passing test whether it said
# anything or not, and the workspace has over a thousand of them. So the tests
# that measure something are named, and the rest stay quiet.
#
# This is the half of #283 that is not about parallelism. The default profile
# discards a passing test's stdout, so across 586 ci runs and 935 harness jobs
# in this repo's history exactly one measurement line survives, and the tick
# budget in #239 was calibrated against an estimated ci p99 of 2.4 to 5.9 ms
# because the measured one was produced on every run of every platform and
# thrown away.
filter = """
    test(=latency_lan_fiber)
    or test(=latency_regional_fiber)
    or test(=latency_dsl)
    or test(=latency_at_capacity)
    or test(=playout_cushion_is_in_the_latency)
    or test(=drift_200ppm_stays_bounded)
    or test(=drift_200ppm_with_resampler)
    or test(=driver_stall_reanchors_and_audio_returns)
    or test(=soak_ten_minutes_regional)
    or test(=a_set_avatar_flood_is_not_an_egress_amplifier)
    or test(=a_capture_gap_the_length_of_a_device_reopen)
    or test(=a_capture_gap_on_a_jittery_stream)
    or test(=full_session_frame_allocations)
"""
success-output = "immediate"

[[profile.default.overrides]]
# The frame-cost gates, which measure the machine and are the only budgets in
# the workspace with a wall-clock deadline that nothing else publishes. Each
# prints median, p99 and max per frame plus what fraction of its budget the
# median took, so the distance to the wall is a series and not a guess.
#
# They share the machine with the rest of their suites, so they gate the median
# and publish the tail. Measured on a 14-core laptop against 14 busy cores, the
# broadcast scene's median moves 1.7x while its worst frame moves 36x, and the
# client session's median moves 1.6x while its worst frame moves 19x. That is
# the same shape the tick gates above measure, so a gate on the tail here would
# be a gate on the scheduler, and the number that says so has to be readable on
# a passing run.
filter = """
    test(=ten_member_scene_meets_frame_budget)
    or test(=full_session_frame_time)
"""
success-output = "immediate"

[[profile.default.overrides]]
# The two crates/stream suites that measure real time without a real encoder:
# how long a submission to a child that never reads takes to come back, and how
# long a pusher takes to be called live. Both assert against windows an order of
# magnitude wider than what they measure, so the number is the only way to know
# whether a window is still generous or nearly spent.
filter = """
    test(=a_child_that_never_reads_video_still_gets_every_byte_of_audio)
    or test(=a_child_that_never_reads_audio_keeps_taking_video_throughout)
    or test(=a_pusher_is_live_once_it_reports_a_push_and_not_before)
    or test(=a_pusher_that_pushed_nothing_is_never_live_however_long_it_lives)
"""
success-output = "immediate"

[[profile.default.overrides]]
# One measurement of the machine rather than of the simulation: how long the
# local provider's launch takes from spawn to ready. READY_TIMEOUT is a fixed
# 5 s that JAMSTREAM_PERF_BUDGET_SECS does not scale, and #339 suspects it is
# tightest on windows-latest, where CreateProcess plus Defender's first-run
# scan of a fresh jamstreamd can cost seconds by itself. Nothing gates on the
# number; it only has to exist on passing runs so the window can be judged
# against data. The pairing test sits in the server suite beside the println.
filter = "test(=launch_join_destroy_end_to_end)"
success-output = "immediate"

[[profile.default.overrides]]
# The jamstreamd-uplift group, defined at the top of the file: the server
# suites that spawn target/<profile>/jamstreamd plus the cli and client suites
# whose `cargo build` rewrites it.
filter = """
    (package(jamstream-server) and (binary(=local_provider) or binary(=shutdown) or binary(=version)))
    or (package(jamstream-cli) and (binary(=local_host) or binary(=local_record)))
    or (package(jamstream-client) and binary(=wizard_local))
"""
test-group = "jamstreamd-uplift"

[[profile.default.overrides]]
# The real-encoder group, defined at the top of the file. Grouped by binary
# rather than by test name so a renamed test cannot silently leave.
#
# Published on success for the same reason as the measurements above: both
# print measured kbps and A/V drift, and relay_chain prints how much of the
# window survived the relay. Two binaries, so the preamble cost is two tests'
# worth.
filter = """
    package(jamstream-stream)
    and (binary(=real_ffmpeg) or binary(=relay_chain))
"""
test-group = "real-encoder"
success-output = "immediate"

[[profile.default.overrides]]
# The live_runtime suite drives two real client runtimes over loopback UDP
# with wall-clock joins, then measures RMS in windows fixed against the
# output file's length. Those windows assume the join and the audio start
# land where an unloaded machine puts them. The suite only ever ran on
# macOS runners until the client tests were opened up to every OS; the
# first windows-latest run measured fader_mute_silences_the_member at an
# rms of 7e-11 in a second that is audible on an idle machine, beside a
# 50 s wizard test and two cores. Same medicine as the tick gates above:
# the machine to themselves, last in the queue, no window or budget
# widened for a scheduler artifact.
filter = 'binary(live_runtime)'
priority = -100
threads-required = "num-test-threads"
