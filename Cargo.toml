[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/engine",
    "crates/session",
    "crates/audio-io",
    "crates/cloud",
    "crates/server",
    "crates/cli",
    "crates/client",
    "crates/harness",
    "crates/broadcast",
    "crates/stream",
    "xtask",
]

[workspace.package]
version = "0.4.2" # x-release-please-version
publish = false
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sean-reid/jamstream"

[workspace.dependencies]
jamstream-protocol = { path = "crates/protocol" }
jamstream-engine = { path = "crates/engine" }
jamstream-session = { path = "crates/session" }
jamstream-server = { path = "crates/server" }
jamstream-cli = { path = "crates/cli" }
jamstream-audio-io = { path = "crates/audio-io" }
# default-features off here so jamstreamd can take the crate without the
# GCP provider; cargo forbids a member overriding the workspace's defaults,
# so the opt-in lives with each consumer instead. See crates/cloud's
# features and the note in crates/server/Cargo.toml.
jamstream-cloud = { path = "crates/cloud", default-features = false }
jamstream-harness = { path = "crates/harness" }
jamstream-broadcast = { path = "crates/broadcast" }
jamstream-stream = { path = "crates/stream" }

serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
thiserror = "2"
tracing = "0.1"
rand = "0.10"
proptest = "1"
# Pinned to 0.7: criterion 0.8 raises its own rust-version to 1.86, above this
# workspace's MSRV, and `cargo clippy --all-targets` would fail to resolve it.
# default-features off drops plotters and rayon, neither of which a text
# report needs; cargo_bench_support is not default-off-able, `cargo bench`
# refuses to run without it.
criterion = { version = "0.7", default-features = false, features = [
    "cargo_bench_support",
] }
# default-features = false drops snow's `std` feature, whose feature list uses
# the legacy `ring/std` syntax (no `?`), which implicitly turns on snow's
# optional `ring` dependency. Nothing can reach ring: `RingResolver` is gated
# behind `ring-resolver`, which we do not enable. All it did was compile ring's
# C and per-architecture assembly into jamstreamd and drag in a third getrandom
# major. snow's `std` feature only swaps `no_std` + `alloc` imports for `std`
# ones; `snow::Error` implements `core::error::Error` either way, so `#[from]`
# in crates/protocol keeps working. Restore std if snow ever needs it, or drop
# the override once upstream writes `ring?/std`.
#
# snow is also why curve25519-dalek compiles twice, including into jamstreamd:
# it asks for `4.1.3`, while ed25519-dalek 3 and x25519-dalek 3 below both
# resolve 5.0.0. There is no lever on this end. `use-curve25519` is what
# supplies the 25519 DH that Noise_IK_25519 needs, so it cannot come off, and
# snow 0.10.0 shipped in July 2025, a year before curve25519-dalek 5.0.0
# existed at all (July 2026); the pin is unchanged on snow's master. 4.1.3 is
# itself the release that fixed RUSTSEC-2024-0344, so the older copy is a spare
# compile unit rather than an unpatched dependency, and a [patch] or a pinned
# fork to delete it would cost more than it saves. It clears on its own when
# snow next releases.
snow = { version = "0.10", default-features = false, features = [
    "default-resolver",
    "default-resolver-crypto",
] }
ed25519-dalek = { version = "3", features = ["serde"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
data-encoding = "2"
# The RS256 signature on the GCP service account JWT. Already in the tree as
# rustls's crypto provider, so naming it adds no compile unit.
ring = "0.17"
blake2 = "0.10"
# The cookie challenge's AEAD. Already in the tree through snow's
# default-resolver crypto, so naming it adds no compile unit.
chacha20poly1305 = "0.10"
getrandom = "0.3"
zeroize = "1"
# opus 0.3 (audiopus_sys) fails to build with CMake >= 4; opusic-c bundles a
# current libopus.
#
# ~1.6, not "1". This crate compiles a vendored C decoder that parses network
# bytes on a publicly reachable VM, and opusic-c's minor version tracks the
# libopus it bundles: ~1.6 keeps us on libopus 1.6.x and makes moving to 1.7 a
# deliberate edit, which is when the vendored tree and its patch want looking
# at again. opusic-sys is transitive and has no lever here beyond Cargo.lock.
#
# Default features, which resolve to ["bundled"] alone. The `no-hardening`,
# `no-stack-protector` and `no-fortify-source` features must stay off: with
# them off, opusic-sys's build.rs passes OPUS_HARDENING=ON,
# OPUS_STACK_PROTECTOR=ON and OPUS_FORTIFY_SOURCE=ON to the libopus build.
# crates/protocol/fuzz/fuzz_targets/opus_decode.rs records the rest of the
# posture and fuzzes the decoder nightly.
opus = { package = "opusic-c", version = "~1.6" }
# default-features off drops `fft_resampler`, and with it realfft and
# rustfft. Both resamplers here are sinc: the device boundary's fixed-ratio
# `Async` and the drift compensator's `Slip`. The FFT path is generic and
# never instantiated, so it reached no binary; what it cost was compile time
# and two more crates to audit.
rubato = { version = "4", default-features = false }
# Pure-Rust FLAC encoder for session recording; nothing to cross-compile for
# the musl and Windows builds. default-features off drops `par` (a
# crossbeam-channel worker pool: the recorder already encodes on its own
# thread and a 2 vCPU VM has nowhere to fan out to), `serde` (config files we
# never read) and `log`. What it adds to the lock is crc + crc-catalog,
# heapless + hash32, md-5, seq-macro, and `built` at build time, all pure
# Rust. flac-codec was the alternative and asks for rust-version 1.88, above
# this workspace's 1.85.
flacenc = { version = "0.5", default-features = false }
# FLAC decoder, dev-only: recordings are verified by decoding with an
# independent implementation, never with the encoder's own decode feature.
claxon = "0.4"
cpal = "0.18"
rtrb = "0.3"
hound = "3"
async-trait = "0.1"
# The unix system calls std has no equivalent for. Already in the lock file
# through tokio, mio and rustix, so taking it directly costs no build time and
# no new supply chain; what it buys is the ability to stop shelling out for
# things the C library answers in one call. Two users (issue #92): `geteuid`
# for `st_uid == geteuid()` on the directory holding the issuer private key,
# and `kill(pid, 0)` / `kill(pid, SIG*)` plus the libproc calls in the local
# provider's liveness probe, which used to spawn `ps` and `kill` for every
# registry entry on every launch. Used behind `#[cfg(unix)]`; there is no
# Windows story here and windows-sys is a separate decision.
libc = "0.2"
tokio ={ version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
wiremock = "0.6"
# No env-filter: it pulls a full regex engine (280 KiB of jamstreamd's
# musl .text) for EnvFilter's span-field directive grammar, which nothing
# here uses. All three binaries parse RUST_LOG with filter::Targets, which
# the fmt feature's std already carries. See #298.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
mimalloc = "0.1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
# Gzip for EC2 user data: RunInstances caps it at 16 KB and the rendered
# cloud-init passed that; cloud-init detects the compression itself.
# Already in the tree through png and tiff, and the default backend is
# miniz_oxide, so nothing new to cross-compile.
flate2 = "1"
dirs = "6"
# default-features off drops `png-format`, which is tiny-skia's own PNG
# encoder and decoder (Pixmap::load_png, encode_png, save_png). Nothing calls
# them: the card renderer builds pixmaps in memory and hands raw RGBA to
# ffmpeg, and the avatars that do arrive as PNG go through the `image` crate.
# Keeping it put a second, older PNG decoder (png 0.17 next to image's 0.18)
# into the jamstreamd musl binary, which is the one process on a publicly
# reachable VM. `std` and `simd` are the rest of the default set and stay on.
tiny-skia = { version = "0.11", default-features = false, features = [
    "std",
    "simd",
] }
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
# Native file picker for the avatar row. The Linux backend is the XDG
# desktop portal rather than GTK, so no GTK reaches the client's link line
# and a sandboxed install gets the portal dialog. The wayland feature is off
# because it only serves rfd's parent-window handle, which we do not set: the
# app's window handle is not reachable from inside the settings sheet.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# persistence: eframe itself saves and restores the native window
# geometry (NativeOptions::persist_window defaults to true), so size,
# position, monitor, and maximized state survive a restart with no
# App::save implementation on our side.
eframe = { version = "0.35", features = ["persistence"] }
egui = "0.35"
egui_kittest = { version = "0.35", features = ["wgpu", "snapshot"] }
# Build-time only: compiles the icon and VERSIONINFO resources into the
# Windows exes. A plain build-dependency, not target-gated, because the
# build scripts that name it must compile on every host; their bodies
# check CARGO_CFG_TARGET_OS and no-op off Windows.
winresource = "0.1"

[profile.test]
opt-level = 1

# panic = "abort" is not available here, and it looks like the cheapest 600 KB
# in jamstreamd. Measuring #224 put .eh_frame, .eh_frame_hdr and
# .gcc_except_table at 613,804 bytes of the 7.5 MB musl artifact, 9.4 percent of
# the growth since v0.1.5, and unwinding is what all of that pays for. But
# jamstream-server's runtime wraps every inbound datagram in
# `std::panic::catch_unwind`, so one peer's malformed packet cannot end the
# session for everyone, and abort makes catch_unwind stop catching. The test
# that notices, `guard_turns_an_unwind_into_a_value_the_loop_can_handle`, aborts
# the test process rather than failing, which is loud only to someone running
# it. Whole-binary opt-level = "z" is out for a different reason: the 2.5 ms mix
# tick and the recorder's FLAC encoding have perf budgets in record.rs.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
debug = true
