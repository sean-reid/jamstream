[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/engine",
    "crates/session",
    "crates/audio-io",
    "crates/cloud",
    "crates/server",
    "crates/cli",
    "crates/client",
    "crates/harness",
    "crates/broadcast",
    "xtask",
]

[workspace.package]
version = "0.1.0" # x-release-please-version
publish = false
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sean-reid/jamstream"

[workspace.dependencies]
jamstream-protocol = { path = "crates/protocol" }
jamstream-engine = { path = "crates/engine" }
jamstream-session = { path = "crates/session" }
jamstream-server = { path = "crates/server" }
jamstream-cli = { path = "crates/cli" }
jamstream-audio-io = { path = "crates/audio-io" }
jamstream-cloud = { path = "crates/cloud" }
jamstream-harness = { path = "crates/harness" }

serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
thiserror = "2"
tracing = "0.1"
rand = "0.10"
proptest = "1"
snow = "0.10"
ed25519-dalek = { version = "3", features = ["serde"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
data-encoding = "2"
aws-lc-rs = "1"
blake2 = "0.10"
getrandom = "0.4"
zeroize = "1"
# opus 0.3 (audiopus_sys) fails to build with CMake >= 4; opusic-c bundles a current libopus.
opus = { package = "opusic-c", version = "1" }
rubato = "4"
cpal = "0.18"
rtrb = "0.3"
hound = "3"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
wiremock = "0.6"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
mimalloc = "0.1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
tiny-skia = "0.12"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
eframe = "0.35"
egui = "0.35"
egui_extras = "0.35"
egui_kittest = { version = "0.35", features = ["wgpu", "snapshot"] }

[profile.test]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
debug = true
