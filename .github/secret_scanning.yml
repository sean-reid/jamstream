# Paths GitHub secret scanning should not raise alerts for.
#
# crates/cloud/testdata/gcp_test_key.json holds a real RSA-2048 private key,
# and crates/cloud/src/providers/gcp_auth.rs has a second copy inline in a
# test. Both are throwaways generated with `openssl genpkey`: no service
# account was ever created for them, they are attached to nothing, and they
# grant access nowhere. The GCP provider signs an RS256 JWT to get a token, so
# the tests that cover that path need a key a real RSA implementation accepts,
# which means a real key.
#
# A scanner cannot tell that from a live credential, so without this the first
# alert to fire here is a false one, and false alerts are how real ones get
# ignored. Generating the key at test time is the better fix and it belongs in
# the crate, not here.
#
# This suppresses alerts. Push protection is separate and unaffected, which is
# fine: both files are already in history, so it has nothing new to block.
paths-ignore:
  - "crates/cloud/testdata/gcp_test_key.json"
  - "crates/cloud/src/providers/gcp_auth.rs"
