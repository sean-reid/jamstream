# Builds and attaches release artifacts when release-please publishes a
# release (beta prereleases included; see release-please.yml for the
# channel design; nothing here inspects the prerelease flag, so betas and
# stable releases build identically).
#
# Trusted distribution status:
#   - macOS: Developer ID signed (hardened runtime + timestamp) using the
#     keychain pattern proven by sign-smoke.yml. Notarization runs when the
#     ASC_* secrets exist and skips loudly when they do not, so the first
#     release ships signed either way and becomes notarized the moment the
#     secrets land. No rebuild or workflow change needed.
#   - Windows: unsigned; named placeholder step until a cert exists.
#   - Linux: plain tarballs; AppImage/deb/rpm are named placeholders.
#
# Server artifact pinning: server-musl runs FIRST, uploads the static
# jamstreamd for BOTH architectures, and exports the tag-pinned download
# URLs and sha256s as job outputs. Two architectures because the providers
# disagree on a CPU: AWS launches Graviton (arm64) instances while GCP and
# DigitalOcean launch x86_64, and a launch selects the pin matching its
# provider (#139 was every AWS launch downloading the x86_64 binary).
# Every client/CLI build below compiles with all four values in the
# environment (JAMSTREAM_SERVER_URL_X86_64 / JAMSTREAM_SERVER_SHA256_X86_64
# and the _AARCH64 pair, read by option_env! in jamstream-cloud), so
# release binaries carry their own server downloads baked in and cloud
# hosting needs no artifact flags. The bare binary assets exist exactly
# for this: cloud-init curls the URL straight to /usr/local/bin and
# sha256sums the file, no tar step on the VM. The tarballs stay for
# humans and the install script.
#
# Desktop bundling: each app artifact ships a platform-native jamstreamd
# beside the app binary (inside JamStream.app/Contents/MacOS on macOS, in
# the zip/tarball on Windows/Linux), which the local provider resolves
# app-adjacent, so hosting on this computer works with no extra install.
#
# Asset names are STABLE (no version embedded) so
# /releases/latest/download/<name> always resolves:
#   jamstream-app-macos.dmg              universal app in a notarized DMG
#                                        (bundles jamstreamd)
#   jamstream-cli-macos-universal.tar.gz universal CLI binary
#   jamstream-cli-windows-x86_64.zip     CLI
#   jamstream-app-windows-x86_64.zip     app (bundles jamstreamd.exe)
#   jamstream-cli-linux-x86_64.tar.gz    CLI (gnu)
#   jamstream-app-linux-x86_64.tar.gz    app (gnu; bundles jamstreamd)
#   jamstreamd-linux-x86_64-musl         static session server, bare
#                                        binary; what pinned clients tell
#                                        x86_64 cloud VMs (GCP,
#                                        DigitalOcean) to download at boot
#   jamstreamd-linux-x86_64-musl.tar.gz  the same server, tarred for
#                                        humans and the install script
#   jamstreamd-linux-aarch64-musl        the arm64 build of the same
#                                        server, for the machines AWS
#                                        launches (Graviton)
#   jamstreamd-linux-aarch64-musl.tar.gz the arm64 server, tarred
#   SHA256SUMS                           checksums of all of the above
#   jamstream-packaging.tar.gz           the rendered Homebrew, winget, and
#                                        AUR manifests for this release,
#                                        derived FROM SHA256SUMS and so
#                                        deliberately not listed in it
name: release

on:
  release:
    types: [published]
  # Release-please publishes with the workflow token, whose events do not
  # trigger workflows (recursion guard), so its workflow chains into this
  # one by explicit dispatch, the sanctioned exception.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build artifacts for
        required: true
        type: string

# Read by default; the jobs that upload assets raise themselves to
# contents: write. Nothing here needs actions, packages, or id-token.
permissions:
  contents: read

# GH_TOKEN is bound per step, not here. On the workflow it sat in process.env
# for every step of every job, including the cargo builds, whose dependency
# graph runs dozens of third-party build scripts, and that token can overwrite
# any asset on the release: the jamstreamd binaries every cloud session VM
# downloads at boot, SHA256SUMS (which is what the installer verifies
# downloads against), and the signed DMG. Only the steps that call gh get it,
# and every checkout below drops the credential rather than persisting it into
# .git/config where any later step could read it back.
env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  # Static musl servers, one per architecture the providers launch: the
  # artifacts session VMs download at boot. Runs first because the URLs
  # and sha256s are compiled into every client and CLI build below.
  server-musl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      server_url_x86_64: ${{ steps.pin.outputs.url_x86_64 }}
      server_sha256_x86_64: ${{ steps.pin.outputs.sha256_x86_64 }}
      server_url_aarch64: ${{ steps.pin.outputs.url_aarch64 }}
      server_sha256_aarch64: ${{ steps.pin.outputs.sha256_aarch64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The live path into this workflow is workflow_dispatch, whose
          # default ref is the default branch, not the tag. Without this
          # the artifacts for a tag are built from whatever main happens
          # to be when the build starts, which with parallel PRs merging
          # is not the tagged commit.
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      # Commit pins, per the policy documented in ci.yml. These actions run in
      # the jobs that build what a release publishes, and the macos job below
      # also holds the Developer ID certificate and the notary key.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      # No build cache in any of the four jobs that produce release artifacts.
      # A restored target directory is object files from an earlier run, which
      # cargo links rather than rebuilds, and the cache is writable by anything
      # that can run a workflow on the default branch. That lands before the
      # fetch-then-offline argument below starts holding, in the job whose
      # output every session VM downloads and in the macos job that holds the
      # Developer ID certificate.
      #
      # It buys nothing measurable either. Releases are days or weeks apart and
      # the entries do not survive the gap: on v0.2.0 and on v0.1.6 the restore
      # in all four jobs logged "No cache found", each job then spent time
      # saving a copy nothing ever read, and the two runs took the same wall
      # clock to a few seconds.
      # musl-tools carries the native musl-gcc; gcc-aarch64-linux-gnu is the
      # cross linker and C compiler for the arm64 build, where rustc's
      # self-contained musl libc does the rest.
      - run: sudo apt-get update && sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
      # Fetch, then compile with the network off. Two things this buys over a
      # bare `cargo build`: --locked means the graph cargo-deny audited is the
      # graph that ships (no silent version bump, no lockfile fix-up), and
      # --offline means the only step that can reach a registry is this one,
      # so nothing a build script does can pull a crate in behind cargo's
      # back. `cargo fetch` with no --target covers every architecture.
      - run: cargo fetch --locked
      - run: cargo build --locked --offline -p jamstream-server --release --target x86_64-unknown-linux-musl
      # The gnu-targeted cross gcc compiles the vendored C (opus, mimalloc)
      # against glibc headers, whose fortify layer emits *_chk symbols musl
      # does not have, so fortify is off for this target; the x86_64 build
      # gets no fortify either, musl-gcc's headers simply never engage it.
      - run: cargo build --locked --offline -p jamstream-server --release --target aarch64-unknown-linux-musl
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
          CFLAGS_aarch64_unknown_linux_musl: -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0
      # Each binary must be fully static AND actually built for the
      # architecture its asset name claims; #139 was a machine downloading
      # a binary of the wrong architecture.
      - name: Verify both binaries are fully static and the right arch
        run: |
          set -eu
          for PAIR in "x86_64:x86-64" "aarch64:aarch64"; do
            TARGET="${PAIR%%:*}"
            ELF_ARCH="${PAIR#*:}"
            BIN="target/$TARGET-unknown-linux-musl/release/jamstreamd"
            file "$BIN" | grep -q 'static'
            file "$BIN" | grep -q "$ELF_ARCH"
            # A truly static binary has no NEEDED shared-library entries.
            # (ldd is useless here: it exits zero on static-pie binaries.)
            if readelf -d "$BIN" | grep -q 'NEEDED'; then
              echo "jamstreamd ($TARGET) links shared libraries:" >&2
              readelf -d "$BIN" | grep 'NEEDED' >&2
              exit 1
            fi
          done
      # Two shapes of each binary: the BARE binary is what cloud-init
      # downloads (curl to /usr/local/bin, sha256sum of the file itself, no
      # tar on the VM) and is the asset the clients pin; the tarball is for
      # humans and the install script. The pinned URLs name the release TAG,
      # not "latest", so a client always launches the server it shipped with.
      - name: Package, upload, and pin the server artifacts
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for ARCH in x86_64 aarch64; do
            DIR="target/$ARCH-unknown-linux-musl/release"
            BARE="jamstreamd-linux-$ARCH-musl"
            ARCHIVE="$BARE.tar.gz"
            cp "$DIR/jamstreamd" "$BARE"
            tar -C "$DIR" -czf "$ARCHIVE" jamstreamd
            gh release upload "$TAG" "$BARE" "$ARCHIVE" --clobber
            SHA=$(sha256sum "$BARE" | cut -d' ' -f1)
            echo "url_$ARCH=https://github.com/${{ github.repository }}/releases/download/$TAG/$BARE" >> "$GITHUB_OUTPUT"
            echo "sha256_$ARCH=$SHA" >> "$GITHUB_OUTPUT"
          done
      # Placeholder: artifact signing (signature published beside the
      # tarball; cloud-init verifies it before boot) lands with the
      # signing milestone. The step name starts with "Unsigned" so its
      # green tick cannot be misread as signing having happened.
      - name: 'Unsigned: no detached signature on the server artifacts'
        run: echo 'The server artifacts are UNSIGNED; the detached signature cloud-init verifies lands with the signing milestone.' >> "$GITHUB_STEP_SUMMARY"

  # Universal (arm64 + x86_64) app bundle in a signed DMG, plus a universal
  # CLI tarball. Signing follows the keychain pattern sign-smoke.yml proved
  # against the same APPLE_* secrets. The app bundle carries a universal
  # native jamstreamd beside the app executable so local hosting works with
  # no extra install.
  macos:
    needs: server-musl
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      JAMSTREAM_SERVER_URL_X86_64: ${{ needs.server-musl.outputs.server_url_x86_64 }}
      JAMSTREAM_SERVER_SHA256_X86_64: ${{ needs.server-musl.outputs.server_sha256_x86_64 }}
      JAMSTREAM_SERVER_URL_AARCH64: ${{ needs.server-musl.outputs.server_url_aarch64 }}
      JAMSTREAM_SERVER_SHA256_AARCH64: ${{ needs.server-musl.outputs.server_sha256_aarch64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The live path into this workflow is workflow_dispatch, whose
          # default ref is the default branch, not the tag. Without this
          # the artifacts for a tag are built from whatever main happens
          # to be when the build starts, which with parallel PRs merging
          # is not the tagged commit.
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      # No build cache; see server-musl. It matters most here, where the
      # linked result is signed and notarized.
      - name: Verify the pinned server artifacts reached this job
        run: |
          set -eu
          printf '%s\n' "$JAMSTREAM_SERVER_URL_X86_64" | grep -q "^https://github.com/.*/$TAG/jamstreamd-linux-x86_64-musl$"
          printf '%s\n' "$JAMSTREAM_SERVER_SHA256_X86_64" | grep -qE '^[0-9a-f]{64}$'
          printf '%s\n' "$JAMSTREAM_SERVER_URL_AARCH64" | grep -q "^https://github.com/.*/$TAG/jamstreamd-linux-aarch64-musl$"
          printf '%s\n' "$JAMSTREAM_SERVER_SHA256_AARCH64" | grep -qE '^[0-9a-f]{64}$'
      # See the server-musl job for why release builds fetch first and then
      # compile offline.
      - run: cargo fetch --locked
      - name: Build both architectures
        run: |
          cargo build --locked --offline --release -p jamstream-client -p jamstream-cli -p jamstream-server --target aarch64-apple-darwin
          cargo build --locked --offline --release -p jamstream-client -p jamstream-cli -p jamstream-server --target x86_64-apple-darwin
      - name: Lipo into universal binaries
        run: |
          mkdir -p target/universal
          for BIN in jamstream-app jamstream jamstreamd; do
            lipo -create \
              "target/aarch64-apple-darwin/release/$BIN" \
              "target/x86_64-apple-darwin/release/$BIN" \
              -output "target/universal/$BIN"
            ARCHS=$(lipo -archs "target/universal/$BIN")
            echo "$BIN: $ARCHS"
            echo "$ARCHS" | grep -q x86_64
            echo "$ARCHS" | grep -q arm64
          done
      # The bundle script copies the COMMITTED
      # crates/client/assets/icon/jamstream.icns into Contents/Resources
      # and sets CFBundleIconFile; no icon rendering happens in CI
      # (scripts/render-icon.sh regenerates the committed asset from the
      # source SVG when the design changes).
      - name: Assemble JamStream.app
        run: ./scripts/macos-app-bundle.sh target/universal/jamstream-app "$TAG" dist target/universal/jamstreamd
      - name: Import certificate into a throwaway keychain
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -eu
          if [ -z "$APPLE_CERT_P12" ]; then
            echo "APPLE_CERT_P12 secret is missing; a release must be signed" >&2
            exit 1
          fi
          # KEYCHAIN_PW stays a shell local. It used to be written to
          # $GITHUB_ENV, which is not log-masked, and no later step ever read
          # it back.
          KEYCHAIN_PW=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PW" release.keychain
          security set-keychain-settings -lut 3600 release.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" release.keychain
          printf '%s' "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k release.keychain \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PW" release.keychain > /dev/null
          security list-keychains -d user -s release.keychain login.keychain
      - name: Codesign app bundle and CLI (hardened runtime + timestamp)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          IDENTITY=$(security find-identity -v -p codesigning release.keychain \
            | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "no valid signing identity in the imported certificate" >&2
            exit 1
          fi
          echo "signing with: $IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          # Nested code first, per Apple's inside-out signing rule: the
          # bundled jamstreamd helper (plain executable at Contents/MacOS,
          # a legal place for helpers) gets its own hardened-runtime
          # signature before the bundle signature seals it in. It captures
          # no audio, so no entitlements. Then the app, which gets the
          # audio-input entitlement (hardened runtime denies microphone
          # capture without it), then the standalone CLI.
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" --keychain release.keychain \
            dist/JamStream.app/Contents/MacOS/jamstreamd
          codesign --force --options runtime --timestamp \
            --entitlements scripts/jamstream-app.entitlements \
            --sign "$IDENTITY" --keychain release.keychain dist/JamStream.app
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" --keychain release.keychain target/universal/jamstream
          for ARTIFACT in dist/JamStream.app dist/JamStream.app/Contents/MacOS/jamstreamd target/universal/jamstream; do
            codesign --verify --strict --verbose=2 "$ARTIFACT"
            codesign --display --verbose=2 "$ARTIFACT" 2>&1 \
              | grep -E "Authority|TeamIdentifier"
            codesign --display --verbose=2 "$ARTIFACT" 2>&1 \
              | grep -q "TeamIdentifier=$APPLE_TEAM_ID"
          done
      # Notarization gate: the ASC_* secrets do not exist yet. When all
      # three land, the steps below start running on the next release with
      # no workflow change; until then they skip with a loud warning so the
      # release is still signed, just not notarized.
      - name: Check notarization credentials
        id: notary
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eu
          if [ -n "$ASC_KEY_P8" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "notarization credentials present; app will be notarized"
          elif [ -n "$ASC_KEY_P8" ] || [ -n "$ASC_KEY_ID" ] || [ -n "$ASC_ISSUER_ID" ]; then
            echo "::error::Notarization secrets are PARTIALLY configured; set all of ASC_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID or none."
            exit 1
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NOTARIZATION SKIPPED: ASC_KEY_P8/ASC_KEY_ID/ASC_ISSUER_ID are not configured. This release is Developer ID SIGNED but NOT notarized; Gatekeeper will warn on first launch. Add the three secrets and the next release notarizes automatically."
          fi
      - name: Notarize and staple the app
        if: steps.notary.outputs.configured == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eu
          # Shell redirection creates 0666 & ~umask, and the runner umask is
          # 022, so without this the notary private key lands 0644.
          umask 077
          # The secret may hold the raw pkcs8 pem or a base64 wrapping of
          # it; accept either so a correctly-set secret never fails on
          # encoding alone.
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc-key.p8"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc-key.p8"
          fi
          if ! grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/asc-key.p8"; then
            echo "::error::ASC_KEY_P8 is neither a pkcs8 pem nor base64 of one" >&2
            exit 1
          fi
          ditto -c -k --keepParent dist/JamStream.app "$RUNNER_TEMP/JamStream.zip"
          xcrun notarytool submit "$RUNNER_TEMP/JamStream.zip" \
            --key "$RUNNER_TEMP/asc-key.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait
          rm -f "$RUNNER_TEMP/asc-key.p8" "$RUNNER_TEMP/JamStream.zip"
          xcrun stapler staple dist/JamStream.app
          xcrun stapler validate dist/JamStream.app
      # Built after stapling so it carries the notarized app.
      - name: Build and sign the DMG
        run: |
          set -eu
          ./scripts/macos-dmg.sh dist/JamStream.app jamstream-app-macos.dmg
          codesign --force --timestamp \
            --sign "$SIGN_IDENTITY" --keychain release.keychain jamstream-app-macos.dmg
          codesign --verify --strict --verbose=2 jamstream-app-macos.dmg
      # Gatekeeper evaluates the disk image a user double-clicks, not just
      # the app inside it, so the dmg needs its own ticket. Without this,
      # spctl reports the dmg as an unnotarized developer id even when the
      # enclosed app is stapled.
      - name: Notarize and staple the DMG
        if: steps.notary.outputs.configured == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eu
          umask 077
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc-key.p8"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc-key.p8"
          fi
          xcrun notarytool submit jamstream-app-macos.dmg \
            --key "$RUNNER_TEMP/asc-key.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait
          rm -f "$RUNNER_TEMP/asc-key.p8"
          xcrun stapler staple jamstream-app-macos.dmg
          xcrun stapler validate jamstream-app-macos.dmg
          spctl -a -t open --context context:primary-signature -v jamstream-app-macos.dmg
      - name: Package CLI tarball and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tar -C target/universal -czf jamstream-cli-macos-universal.tar.gz jamstream
          gh release upload "$TAG" \
            jamstream-app-macos.dmg \
            jamstream-cli-macos-universal.tar.gz \
            --clobber
      # Both notarize steps write the key and then remove it on their happy
      # path only, so a `notarytool submit --wait` that fails, and the DMG
      # submit can take minutes, leaves the notary private key in RUNNER_TEMP
      # until the job ends. Unconditional scrub, next to the keychain
      # teardown.
      - name: Scrub the notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-key.p8" "$RUNNER_TEMP/JamStream.zip"
      - name: Remove the throwaway keychain
        if: always()
        run: security delete-keychain release.keychain || true

  windows:
    needs: server-musl
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      JAMSTREAM_SERVER_URL_X86_64: ${{ needs.server-musl.outputs.server_url_x86_64 }}
      JAMSTREAM_SERVER_SHA256_X86_64: ${{ needs.server-musl.outputs.server_sha256_x86_64 }}
      JAMSTREAM_SERVER_URL_AARCH64: ${{ needs.server-musl.outputs.server_url_aarch64 }}
      JAMSTREAM_SERVER_SHA256_AARCH64: ${{ needs.server-musl.outputs.server_sha256_aarch64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The live path into this workflow is workflow_dispatch, whose
          # default ref is the default branch, not the tag. Without this
          # the artifacts for a tag are built from whatever main happens
          # to be when the build starts, which with parallel PRs merging
          # is not the tagged commit.
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      # No build cache; see server-musl.
      - name: Verify the pinned server artifacts reached this job
        shell: bash
        run: |
          set -eu
          printf '%s\n' "$JAMSTREAM_SERVER_URL_X86_64" | grep -q "^https://github.com/.*/$TAG/jamstreamd-linux-x86_64-musl$"
          printf '%s\n' "$JAMSTREAM_SERVER_SHA256_X86_64" | grep -qE '^[0-9a-f]{64}$'
          printf '%s\n' "$JAMSTREAM_SERVER_URL_AARCH64" | grep -q "^https://github.com/.*/$TAG/jamstreamd-linux-aarch64-musl$"
          printf '%s\n' "$JAMSTREAM_SERVER_SHA256_AARCH64" | grep -qE '^[0-9a-f]{64}$'
      # See the server-musl job for why release builds fetch first and then
      # compile offline.
      - run: cargo fetch --locked
      - run: cargo build --locked --offline --release -p jamstream-client -p jamstream-cli -p jamstream-server
      # The peer of the other platforms' artifact checks (lipo -archs on
      # macOS, file + readelf on Linux). Windows had none: a zip whose exe
      # could not start would have shipped checksummed and verified. The
      # app exe opens a window, so its smoke is the header check below.
      - name: The built binaries run and match the tag
        shell: bash
        run: |
          set -eu
          ./target/release/jamstream.exe --version
          ./target/release/jamstream.exe --version | grep -qF "${TAG#v}"
          ./target/release/jamstreamd.exe --version
      # Machine type and subsystem are hard gates: the app must be a GUI
      # binary (no console window on a double-click, which is the one place
      # a regression here shows) while the CLI and server stay console.
      - name: The exes are x64 with the right subsystems
        shell: powershell
        run: |
          $want = @{ 'jamstream.exe' = 3; 'jamstream-app.exe' = 2; 'jamstreamd.exe' = 3 }
          foreach ($exe in 'jamstream.exe', 'jamstream-app.exe', 'jamstreamd.exe') {
            $b = [IO.File]::ReadAllBytes("target/release/$exe")
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            $machine = [BitConverter]::ToUInt16($b, $pe + 4)
            $subsystem = [BitConverter]::ToUInt16($b, $pe + 24 + 68)
            '{0}: machine=0x{1:X4} subsystem={2}' -f $exe, $machine, $subsystem
            if ($machine -ne 0x8664) { throw "$exe is not an x86_64 PE image" }
            if ($subsystem -ne $want[$exe]) { throw "$exe subsystem is $subsystem, expected $($want[$exe])" }
          }
      # ci.yml's release-build job runs this same script on every push to main,
      # so an import that should not be there fails while a tag can still be
      # avoided rather than after one is cut.
      - name: No exe imports the redistributable CRT
        shell: pwsh
        run: ./scripts/check-windows-crt.ps1 target/release jamstream.exe jamstream-app.exe jamstreamd.exe
      # Placeholder: Authenticode signing of both .exe files lands once a
      # Windows code-signing certificate exists. The step name starts with
      # "Unsigned" so its green tick cannot be misread as signing having
      # happened.
      - name: 'Unsigned: no Authenticode signature on the exes'
        shell: bash
        run: echo 'The Windows exes are UNSIGNED; Authenticode signing lands once a Windows certificate exists.' >> "$GITHUB_STEP_SUMMARY"
      # The app zip carries jamstreamd.exe beside jamstream-app.exe; the
      # local provider resolves the app-adjacent helper, so hosting on this
      # computer works straight from the unzipped folder. The exe itself
      # embeds the icon and a VERSIONINFO block (crates/client/build.rs);
      # the committed jamstream.ico rides along for anything that wants a
      # loose .ico file, and uninstall.ps1 deletes exactly this list.
      - name: Package and upload archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          7z a jamstream-cli-windows-x86_64.zip ./target/release/jamstream.exe
          7z a jamstream-app-windows-x86_64.zip ./target/release/jamstream-app.exe ./target/release/jamstreamd.exe ./crates/client/assets/icon/jamstream.ico
          # install.ps1 extracts by name and uninstall.ps1 deletes exactly
          # this list; a stored path prefix or a missing member breaks both,
          # so the layout is asserted rather than trusted. 7z was handed
          # multi-segment paths above and derives the stored names itself.
          7z l -ba -slt jamstream-cli-windows-x86_64.zip | tr -d '\r' | sed -n 's/^Path = //p' | sort > cli-contents.txt
          printf 'jamstream.exe\n' | cmp - cli-contents.txt
          7z l -ba -slt jamstream-app-windows-x86_64.zip | tr -d '\r' | sed -n 's/^Path = //p' | sort > app-contents.txt
          printf 'jamstream-app.exe\njamstream.ico\njamstreamd.exe\n' | cmp - app-contents.txt
          gh release upload "$TAG" \
            jamstream-cli-windows-x86_64.zip \
            jamstream-app-windows-x86_64.zip \
            --clobber
      # The winget manifest itself exists now (the packaging job renders it
      # for the zip); only a signed MSI is still missing. The step name
      # starts with "Unsigned" so its green tick cannot be misread as an
      # MSI having been built and signed.
      - name: 'Unsigned: no signed MSI, the zip is the only installer'
        shell: bash
        run: echo 'No signed MSI yet; it lands with the installer milestone. The winget manifest for the zip is rendered by the packaging job.' >> "$GITHUB_STEP_SUMMARY"

  linux:
    needs: server-musl
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      JAMSTREAM_SERVER_URL_X86_64: ${{ needs.server-musl.outputs.server_url_x86_64 }}
      JAMSTREAM_SERVER_SHA256_X86_64: ${{ needs.server-musl.outputs.server_sha256_x86_64 }}
      JAMSTREAM_SERVER_URL_AARCH64: ${{ needs.server-musl.outputs.server_url_aarch64 }}
      JAMSTREAM_SERVER_SHA256_AARCH64: ${{ needs.server-musl.outputs.server_sha256_aarch64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The live path into this workflow is workflow_dispatch, whose
          # default ref is the default branch, not the tag. Without this
          # the artifacts for a tag are built from whatever main happens
          # to be when the build starts, which with parallel PRs merging
          # is not the tagged commit.
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      # No build cache; see server-musl.
      - name: Verify the pinned server artifacts reached this job
        run: |
          set -eu
          printf '%s\n' "$JAMSTREAM_SERVER_URL_X86_64" | grep -q "^https://github.com/.*/$TAG/jamstreamd-linux-x86_64-musl$"
          printf '%s\n' "$JAMSTREAM_SERVER_SHA256_X86_64" | grep -qE '^[0-9a-f]{64}$'
          printf '%s\n' "$JAMSTREAM_SERVER_URL_AARCH64" | grep -q "^https://github.com/.*/$TAG/jamstreamd-linux-aarch64-musl$"
          printf '%s\n' "$JAMSTREAM_SERVER_SHA256_AARCH64" | grep -qE '^[0-9a-f]{64}$'
      # Same desktop build deps ci.yml uses (alsa, wayland/xkb for eframe,
      # pipewire + dbus).
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libpipewire-0.3-dev libdbus-1-dev
      # See the server-musl job for why release builds fetch first and then
      # compile offline.
      - run: cargo fetch --locked
      - run: cargo build --locked --offline --release -p jamstream-client -p jamstream-cli -p jamstream-server
      # The app tarball carries jamstreamd (the gnu build, same as the app)
      # beside jamstream-app; the local provider resolves the app-adjacent
      # helper, so hosting on this computer works straight from the
      # extracted folder. It also carries the committed 512px icon (named
      # jamstream.png so the .desktop Icon=jamstream key matches when both
      # are installed under the XDG hicolor/applications dirs) and the
      # .desktop entry.
      - name: Package and upload tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -C target/release -czf jamstream-cli-linux-x86_64.tar.gz jamstream
          mkdir -p dist/linux
          cp target/release/jamstream-app target/release/jamstreamd dist/linux/
          cp crates/client/assets/icon/jamstream-512.png dist/linux/jamstream.png
          cp scripts/jamstream.desktop dist/linux/
          tar -C dist/linux -czf jamstream-app-linux-x86_64.tar.gz jamstream-app jamstreamd jamstream.png jamstream.desktop
          gh release upload "$TAG" \
            jamstream-cli-linux-x86_64.tar.gz \
            jamstream-app-linux-x86_64.tar.gz \
            --clobber
      # AUR PKGBUILDs now come out of the packaging job below; deb, rpm, and
      # AppImage are still unbuilt.
      - name: Build deb/rpm/AppImage (not yet implemented)
        run: echo 'Placeholder; deb, rpm, and AppImage land with the installer milestone. The AUR PKGBUILDs are rendered by the packaging job.'

  # SHA256SUMS covers every asset uploaded above and is the verification
  # anchor for downstream consumers: the future install script and the
  # downloads page both fetch /releases/latest/download/SHA256SUMS and
  # check downloaded artifacts against it. It must therefore be generated
  # LAST, from the assets as they actually exist on the release.
  checksums:
    needs: [server-musl, macos, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The live path into this workflow is workflow_dispatch, whose
          # default ref is the default branch, not the tag. Without this
          # the artifacts for a tag are built from whatever main happens
          # to be when the build starts, which with parallel PRs merging
          # is not the tagged commit.
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Download all release assets, checksum, upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir assets
          gh release download "$TAG" --dir assets --pattern '*'
          rm -f assets/SHA256SUMS # ignore a previous run's sums file
          cd assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber

  # Package-manager manifests: the Homebrew cask and formula, the winget
  # manifest set, and the two AUR PKGBUILDs, rendered for THIS tag with
  # this release's real hashes. It needs checksums because
  # scripts/render-packaging.sh reads every hash out of the published
  # SHA256SUMS rather than recomputing anything, which also means the
  # rendered bundle cannot appear in SHA256SUMS itself.
  #
  # The bundle is attached to the release so the two manual channels
  # (a winget-pkgs pull request, an AUR push) are a copy, never a
  # re-derivation of hashes by hand. The committed copies under packaging/
  # are the same files for the previous release; see packaging/README.md.
  packaging:
    needs: checksums
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The live path into this workflow is workflow_dispatch, whose
          # default ref is the default branch, not the tag. Without this
          # the artifacts for a tag are built from whatever main happens
          # to be when the build starts, which with parallel PRs merging
          # is not the tagged commit.
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      # render-packaging.sh downloads this tag's SHA256SUMS, authenticated
      # when GH_TOKEN is set and anonymous otherwise, so the token stays on
      # this step to keep the fetch off the unauthenticated rate limit.
      - name: Render every manifest from this release's SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/render-packaging.sh --output-dir rendered "$TAG"
      - name: Show what was rendered
        run: |
          set -eu
          find rendered -type f | sort
          grep -RE '^\s*(sha256|sha256sums|InstallerSha256)' rendered | sort
      - name: Attach the rendered manifests to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tar -C rendered -czf jamstream-packaging.tar.gz .
          gh release upload "$TAG" jamstream-packaging.tar.gz --clobber
      # Homebrew is the one channel that can publish itself: a tap is just a
      # git repository. It stays gated on a token so a release never fails
      # for a distribution channel that does not exist yet. When
      # sean-reid/homebrew-jamstream exists and HOMEBREW_TAP_TOKEN (a PAT
      # with contents:write on it) is set, the next release pushes the cask
      # and formula with no workflow change; until then this skips loudly
      # and the manifests are still attached to the release above.
      - name: Push the Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: sean-reid/homebrew-jamstream
        run: |
          set -eu
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW TAP PUSH SKIPPED: no HOMEBREW_TAP_TOKEN secret. The rendered cask and formula are attached to this release inside jamstream-packaging.tar.gz. Create $TAP_REPO and add the token to publish automatically."
            exit 0
          fi
          # The tap token never appears on a command line: curl reads the
          # authorization header from a config on stdin, and git reads the
          # token from this step's environment through the askpass helper
          # below. On argv it was in every ps listing for the life of the
          # process.
          STATUS=$(printf 'header = "Authorization: Bearer %s"\n' "$HOMEBREW_TAP_TOKEN" \
            | curl -sS --config - -o tap-repo.json -w '%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$TAP_REPO")
          if [ "$STATUS" = 404 ]; then
            echo "::warning::HOMEBREW TAP PUSH SKIPPED: https://github.com/$TAP_REPO does not exist, or the token cannot see it. Create it as a public, empty repository; nothing else needs to change."
            exit 0
          fi
          if [ "$STATUS" != 200 ]; then
            echo "::error::the GitHub API returned $STATUS for $TAP_REPO; check HOMEBREW_TAP_TOKEN"
            exit 1
          fi
          # Pushing to an explicit ref works whether the tap is empty (its
          # first commit) or already has history, and whatever its default
          # branch is called.
          BRANCH=$(sed -n 's/.*"default_branch": *"\([^"]*\)".*/\1/p' tap-repo.json | head -1)
          [ -n "$BRANCH" ] || BRANCH=main
          # Cloning with the token in the url wrote it into tap/.git/config,
          # where every later step in the job could read it back. The askpass
          # helper holds no secret itself; git runs it on the auth challenge
          # and it prints the token out of the environment. The clone url
          # carries only the username, so nothing is persisted.
          cat > "$RUNNER_TEMP/askpass-tap.sh" <<'ASKPASS'
          #!/bin/sh
          printf %s "$HOMEBREW_TAP_TOKEN"
          ASKPASS
          chmod +x "$RUNNER_TEMP/askpass-tap.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass-tap.sh"
          git clone "https://x-access-token@github.com/$TAP_REPO.git" tap
          mkdir -p tap/Casks tap/Formula
          cp rendered/homebrew/Casks/jamstream.rb tap/Casks/jamstream.rb
          cp rendered/homebrew/Formula/jamstream-cli.rb tap/Formula/jamstream-cli.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/jamstream.rb Formula/jamstream-cli.rb
          if git diff --cached --quiet; then
            echo "the tap already carries $TAG; nothing to push"
            exit 0
          fi
          git commit -m "chore: jamstream $TAG"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "pushed $TAG to https://github.com/$TAP_REPO ($BRANCH)"
      # Scoop is the same shape as the tap: a bucket is just a git
      # repository, so the release publishes it the same way, gated on a
      # token so a release never fails for the channel.
      #
      # Its own token, with no fallback to the tap's. That fallback shipped
      # in v0.2.0 and cost the release: a fine-grained tap token can read a
      # public bucket and clone it, so every check here passed and the push
      # 403'd at the end, after every artifact had already been published.
      # A token that cannot write is worse than no token, because the
      # missing-token path says so and skips.
      - name: Push the Scoop bucket
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          BUCKET_REPO: sean-reid/scoop-jamstream
        run: |
          set -eu
          if [ -z "${SCOOP_BUCKET_TOKEN:-}" ]; then
            echo "::warning::SCOOP BUCKET PUSH SKIPPED: no SCOOP_BUCKET_TOKEN secret with contents write on $BUCKET_REPO. The rendered manifests are attached to this release inside jamstream-packaging.tar.gz."
            exit 0
          fi
          # Off argv and out of .git/config, exactly as the tap step above.
          STATUS=$(printf 'header = "Authorization: Bearer %s"\n' "$SCOOP_BUCKET_TOKEN" \
            | curl -sS --config - -o bucket-repo.json -w '%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$BUCKET_REPO")
          if [ "$STATUS" = 404 ]; then
            echo "::warning::SCOOP BUCKET PUSH SKIPPED: https://github.com/$BUCKET_REPO does not exist, or the token cannot see it."
            exit 0
          fi
          if [ "$STATUS" != 200 ]; then
            echo "::error::the GitHub API returned $STATUS for $BUCKET_REPO; check the token"
            exit 1
          fi
          BRANCH=$(sed -n 's/.*"default_branch": *"\([^"]*\)".*/\1/p' bucket-repo.json | head -1)
          [ -n "$BRANCH" ] || BRANCH=main
          cat > "$RUNNER_TEMP/askpass-bucket.sh" <<'ASKPASS'
          #!/bin/sh
          printf %s "$SCOOP_BUCKET_TOKEN"
          ASKPASS
          chmod +x "$RUNNER_TEMP/askpass-bucket.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass-bucket.sh"
          git clone "https://x-access-token@github.com/$BUCKET_REPO.git" bucket
          mkdir -p bucket/bucket
          cp rendered/scoop/bucket/jamstream.json bucket/bucket/jamstream.json
          cp rendered/scoop/bucket/jamstream-app.json bucket/bucket/jamstream-app.json
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/jamstream.json bucket/jamstream-app.json
          if git diff --cached --quiet; then
            echo "the bucket already carries $TAG; nothing to push"
            exit 0
          fi
          git commit -m "chore: jamstream $TAG"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "pushed $TAG to https://github.com/$BUCKET_REPO ($BRANCH)"
