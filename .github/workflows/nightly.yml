# Nightly work with no wall-time budget: fuzzing the unauthenticated attack
# surface, the full test suite (including E2E stories and UI work) on all
# three OSes, and the gated live cloud smoke.
name: nightly

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# The cloud smoke below spends real money against a live DigitalOcean account,
# so it is the one workflow where a token wider than it needs would matter
# most. Nothing here writes to the repository; the crash and preview uploads
# use the runner's own token.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The engine and protocol microbenchmarks. Deliberately NOT on the PR path:
  # the suite takes about 9 minutes against a 10 minute wall-time budget, and
  # criterion's numbers on a shared runner are too noisy to gate on. The same
  # benchmark was watched swinging 5x on a 14-core laptop under load; a
  # two-core shared runner is worse.
  #
  # So this does not fail on a regression, deliberately. It exists so the
  # tick-budget table lands in a job summary every night and a 10x change is
  # visible to anyone who looks. No --save-baseline for the same reason:
  # runner-to-runner variance would produce false failures and train everyone
  # to ignore the job.
  #
  # No apt step: engine and protocol pull in neither the audio nor the UI
  # stack, unlike every other job that touches this workspace.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
      - name: Benchmark the engine and protocol hot paths
        run: |
          {
            echo '## Benchmarks'
            echo '```'
            cargo bench --locked -p jamstream-engine -p jamstream-protocol 2>&1 \
              | grep -vE '^(Benchmarking|Found [0-9]+ outliers)'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: criterion
          path: target/criterion/
          if-no-files-found: warn

  # Each target gets 10 minutes on top of its committed seed corpus plus
  # whatever the cache has grown on previous nights. Crashes upload as
  # artifacts and then become committed regression tests.
  #
  # The four original targets are pure parsers, so they run at thousands of
  # exec/s. The three added ones set up real state per execution and are
  # correspondingly slower (measured locally, sanitizer off: transport_open
  # 700-1000/s, avatar_reassembly ~630/s, handshake_read_init 4500-6000/s),
  # which is the price of fuzzing anything past the first parse. Each still
  # gets hundreds of thousands of executions per night.
  #
  # avatar_reassembly reaches the session core, so this job now builds
  # jamstream-session and jamstream-engine (and libopus through cmake, which
  # ubuntu runners have) under the sanitizer. That lands inside the existing
  # 45 minute ceiling.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - wire_parse
          - invite_decode
          - media_decode
          - control_receive
          - handshake_read_init
          - transport_open
          - avatar_reassembly
    steps:
      - uses: actions/checkout@v7
      # Pinned like everything else, but to master with `toolchain: nightly`:
      # the @nightly branch is master plus that as a default, and it gets
      # force-pushed. The toolchain itself is still whatever nightly is today.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
        with:
          workspaces: crates/protocol/fuzz
      - run: cargo install cargo-fuzz --locked
      # No --locked on the `cargo fuzz run` below: cargo-fuzz has no such flag
      # and would reject it before libFuzzer's argument list. The fuzz targets
      # live in their own workspace with their own Cargo.lock anyway, so the
      # audited root lockfile is not what is being built here.
      # The key includes the run id so every night saves its grown corpus;
      # restore-keys picks up the most recent previous night. The restore
      # unpacks on top of the committed seeds, never replacing them.
      - uses: actions/cache@v6
        with:
          path: crates/protocol/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-
      # The explicit +nightly matters: rust-toolchain.toml pins the repo to
      # stable and would otherwise win over the installed nightly, and
      # cargo-fuzz needs nightly for its sanitizer flags.
      #
      # Reproducing locally: the default AddressSanitizer runtime hangs with
      # no output on macOS aarch64 nightly, so add `--sanitizer none` there.
      # Linux runners are fine, which is why CI keeps ASan on: it is half the
      # value of fuzzing the aead and reassembly buffers.
      - run: cargo +nightly fuzz run ${{ matrix.target }} --fuzz-dir crates/protocol/fuzz -- -max_total_time=600
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: crates/protocol/fuzz/artifacts/
          if-no-files-found: warn

  # The full suite, harness gates and multi-second E2E user stories
  # included, on every OS. Same client exclusion as ci.yml: the kittest
  # snapshot baselines are macOS renders and headless ubuntu/windows
  # runners lack a reliable wgpu adapter, so jamstream-client tests run
  # only on macOS.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libpipewire-0.3-dev libdbus-1-dev
      - if: runner.os == 'macOS'
        run: cargo test --locked --workspace
      - if: runner.os != 'macOS'
        run: cargo test --locked --workspace --exclude jamstream-client
      - if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: nightly-ui-previews
          path: target/ui-previews/
          if-no-files-found: ignore

  # Live cloud smoke, spending real (sub-cent) money. Secrets are not
  # readable in a job-level `if`, so the gate is a first step that copies
  # the secret into env and publishes whether it was non-empty; every later
  # step conditions on that output. On forks and secretless clones the job
  # succeeds as a no-op.
  #
  # DIGITALOCEAN_TOKEN is bound per step, not on the job. On the job it sat in
  # process.env for every action in the job, including the toolchain and cache
  # actions, and that token can create and destroy droplets. Only the two
  # steps that talk to DigitalOcean get it.
  cloud-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Detect cloud credentials
        id: creds
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          if [ -n "$DIGITALOCEAN_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo 'No cloud credentials configured; live smoke skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.creds.outputs.available == 'true'
        uses: actions/checkout@v7
      # Commit pins, per the policy documented in ci.yml. This job holds a
      # credential that can create and destroy droplets.
      - if: steps.creds.outputs.available == 'true'
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - if: steps.creds.outputs.available == 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
      # Placeholder smoke: a real authenticated sweep of the account in
      # dry-run mode proves credentials, API reachability, and tag listing
      # without destroying anything.
      - name: Sweep dry-run against live account
        if: steps.creds.outputs.available == 'true'
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: cargo run --locked -p jamstream-cli --release -- sweep --dry-run --provider digitalocean
      # Later addition goes here: provision the cheapest real instance,
      # verify boot + handshake + self-termination, then assert a final
      # sweep finds nothing (testing.md, "Cloud provider tests" item 3).
      - name: Full launch and destroy smoke (not yet implemented)
        if: steps.creds.outputs.available == 'true'
        run: echo 'Placeholder; full provision/boot/self-terminate/sweep smoke lands in a later change.'
