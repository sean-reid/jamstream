# Nightly work with no wall-time budget: the hot-path benchmarks, fuzzing the
# unauthenticated attack surface, the full test suite (including E2E stories
# and UI work) on all three OSes, and the gated live cloud smoke.
name: nightly

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# The cloud smoke below spends real money against a live DigitalOcean account,
# so it is the one workflow where a token wider than it needs would matter
# most. Nothing here writes to the repository; the crash and preview uploads
# use the runner's own token.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The engine, protocol and audio-io hot-path benchmarks. Deliberately not on
  # the PR path: the suite runs for minutes, and criterion's numbers on a
  # shared two-core runner are too noisy to gate on. The same benchmark was
  # watched swinging 5x on a 14 core laptop while other work ran.
  #
  # So this does not fail on a regression and takes no --save-baseline, both
  # deliberate. Runner-to-runner variance would produce false failures and
  # train everyone to ignore the job. The value is that the tick-budget table
  # lands in a job summary every night, where a 10x change is visible to
  # anyone who looks.
  #
  # The apt step is audio-io's alone: the boundary converter it benches is
  # pure arithmetic, but the crate carries cpal on Linux, so the build wants
  # ALSA, PipeWire and dbus headers. No UI stack here, unlike every other job
  # in this file, and criterion adds nothing with default features off.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libdbus-1-dev
      # tee, so a failure is readable in the log and not only in the summary.
      # The grep drops criterion's per-benchmark progress chatter and its
      # outlier counts; the tick table and every `time:` line survive it.
      #
      # The copy in bench.out is what the next step counts. It cannot read
      # GITHUB_STEP_SUMMARY instead: that path is unique per step, so the
      # check would grep its own empty file and fail on 0 forever, which is
      # how this job spent its first five nights.
      - name: Benchmark the engine, protocol and audio-io hot paths
        run: |
          {
            echo '## Benchmarks'
            echo '```'
            cargo bench --locked -p jamstream-engine -p jamstream-protocol -p jamstream-audio-io 2>&1 \
              | grep -vE '^(Benchmarking|Found [0-9]+ outliers)'
            echo '```'
          } | tee bench.out | tee -a "$GITHUB_STEP_SUMMARY"
      # A run with no `time:` lines in it means cargo bench found no bench
      # targets and exited happy, which is exactly the silent no-op this job
      # exists to prevent. Fail loudly instead.
      #
      # A passing run measures 53: 45 across engine and protocol, 8 in
      # audio-io. The floor sits just under that rather than at the old 20,
      # because 20 would have passed happily with audio-io's whole bench
      # target missing, which is the same silent no-op one crate down.
      - name: Check the summary holds real measurements
        run: |
          count=$(grep -c 'time:' bench.out || true)
          echo "criterion reported $count measurements"
          test "$count" -ge 50
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: criterion
          path: target/criterion/
          if-no-files-found: warn

  # Each target gets 10 minutes on top of its committed seed corpus plus
  # whatever the cache has grown on previous nights. Crashes upload as
  # artifacts and then become committed regression tests.
  #
  # The four original targets are pure parsers, so they run at thousands of
  # exec/s. The three added ones set up real state per execution and are
  # correspondingly slower (measured locally, sanitizer off: transport_open
  # 700-1000/s, avatar_reassembly ~630/s, handshake_read_init 4500-6000/s),
  # which is the price of fuzzing anything past the first parse. Each still
  # gets hundreds of thousands of executions per night. avatar_rx_push skips
  # the handshake and drives AvatarRx::push directly through the session
  # crate's fuzzing feature (~1800/s locally, mostly Blake2s over the
  # synthetic preimages), so the reassembly interleavings get depth while
  # avatar_reassembly keeps the production entry point covered.
  #
  # avatar_reassembly reaches the session core, so this job now builds
  # jamstream-session and jamstream-engine (and libopus through cmake, which
  # ubuntu runners have) under the sanitizer. That lands inside the existing
  # 45 minute ceiling.
  #
  # opus_decode is the only target that spends its execution inside C. It runs
  # at ~48000/s locally with the sanitizer off, so it is not the slow one;
  # ASan over the vendored libopus is why it matters that it runs here and not
  # only on a laptop.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - wire_parse
          - invite_decode
          - media_decode
          - control_receive
          - handshake_read_init
          - transport_open
          - avatar_reassembly
          - avatar_rx_push
          - opus_decode
    steps:
      - uses: actions/checkout@v7
      # Pinned like everything else, but to master with `toolchain: nightly`:
      # the @nightly branch is master plus that as a default, and it gets
      # force-pushed. The toolchain itself is still whatever nightly is today.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
        with:
          workspaces: crates/protocol/fuzz
      - run: cargo install cargo-fuzz --locked
      # No --locked on the `cargo fuzz run` below: cargo-fuzz has no such flag
      # and would reject it before libFuzzer's argument list. The fuzz targets
      # live in their own workspace with their own Cargo.lock anyway, so the
      # audited root lockfile is not what is being built here.
      # The key includes the run id so every night saves its grown corpus;
      # restore-keys picks up the most recent previous night. The restore
      # unpacks on top of the committed seeds, never replacing them.
      - uses: actions/cache@v6
        with:
          path: crates/protocol/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-
      # The explicit +nightly matters: rust-toolchain.toml pins the repo to
      # stable and would otherwise win over the installed nightly, and
      # cargo-fuzz needs nightly for its sanitizer flags.
      #
      # Reproducing locally: the default AddressSanitizer runtime hangs with
      # no output on macOS aarch64 nightly, so add `--sanitizer none` there.
      # Linux runners are fine, which is why CI keeps ASan on: it is half the
      # value of fuzzing the aead and reassembly buffers.
      - run: cargo +nightly fuzz run ${{ matrix.target }} --fuzz-dir crates/protocol/fuzz -- -max_total_time=600
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: crates/protocol/fuzz/artifacts/
          if-no-files-found: warn

  # The full suite, harness gates and multi-second E2E user stories
  # included, on every OS. Same snapshot exclusion as ci.yml: only the
  # client's ui_snapshots binary is macOS-bound (macOS-rendered pixel
  # baselines, and headless ubuntu/windows runners lack a reliable wgpu
  # adapter); the rest of the client suite runs everywhere.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libpipewire-0.3-dev libdbus-1-dev
      # The pinned ffmpeg, for the reasons documented in ci.yml: this job runs
      # crates/stream's tests too, and real_ffmpeg fails on Linux when the
      # encoder a session VM actually boots with is not on PATH.
      - if: runner.os == 'Linux'
        name: Install the ffmpeg a session VM runs
        run: scripts/install-pinned-ffmpeg.sh "$RUNNER_TEMP/pinned-ffmpeg"
      - if: runner.os == 'Linux'
        run: echo "$RUNNER_TEMP/pinned-ffmpeg" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: cargo-nextest
      # nextest rather than `cargo test`, for the isolation in
      # .config/nextest.toml. Three tests in this workspace read a wall clock,
      # and this job ran them under libtest's default parallelism among a
      # thousand cpu-bound simulations, which is the arrangement that made
      # windows-latest report a tick p99 19 times its median on the ci path
      # (#276). It had not bitten here yet, and it reproduces on demand: run
      # this same workspace on a 14-core laptop and `tick_budget_at_capacity`
      # measures p99 3399 us against a 435 us median and a 60779 us max, 136%
      # of budget, and fails. Alone on the same laptop it measures p99 435 us
      # against a 387 us median. The scheduler is what moved, so the fix is
      # isolation and not a wider budget.
      #
      # `cargo test` cannot express that, and a second copy of the workflow
      # trick from #282 would have left a laptop run still lying. The config
      # covers all three paths, so there is one place that says which tests
      # get the machine to themselves.
      #
      # Nothing is lost by leaving libtest: nextest does not run doctests, and
      # this workspace has none. Every fenced block in it is `text` or
      # `console` (ascii diagrams and copy-pasteable commands), so
      # `cargo test --doc` compiles nothing here today.
      #
      # The harness has two wall-clock gates, and their budgets are
      # calibrated on a developer laptop. ci.yml scales them for shared
      # runners; this job runs the same tests and did not, so both were
      # running at unscaled budgets here and would flake before they ever
      # told us anything true. Same multiplier as ci.yml.
      - if: runner.os == 'macOS'
        env:
          JAMSTREAM_PERF_BUDGET_SECS: "120"
        run: cargo nextest run --locked --workspace
      - if: runner.os != 'macOS'
        env:
          JAMSTREAM_PERF_BUDGET_SECS: "120"
        run: cargo nextest run --locked --workspace -E 'not binary(ui_snapshots)'
      - if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: nightly-ui-previews
          path: target/ui-previews/
          if-no-files-found: ignore

  # Live cloud smoke, spending real (sub-cent) money. Secrets are not
  # readable in a job-level `if`, so the gate is a first step that copies
  # the secret into env and publishes whether it was non-empty; every later
  # step conditions on that output. On forks and secretless clones the job
  # succeeds as a no-op.
  #
  # DIGITALOCEAN_TOKEN is bound per step, not on the job. On the job it sat in
  # process.env for every action in the job, including the toolchain and cache
  # actions, and that token can create and destroy droplets. Only the two
  # steps that talk to DigitalOcean get it.
  cloud-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Detect cloud credentials
        id: creds
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          if [ -n "$DIGITALOCEAN_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo 'No cloud credentials configured; live smoke skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.creds.outputs.available == 'true'
        uses: actions/checkout@v7
      # Commit pins, per the policy documented in ci.yml. This job holds a
      # credential that can create and destroy droplets.
      - if: steps.creds.outputs.available == 'true'
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - if: steps.creds.outputs.available == 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
      # Placeholder smoke: a real authenticated sweep of the account in
      # dry-run mode proves credentials, API reachability, and tag listing
      # without destroying anything.
      - name: Sweep dry-run against live account
        if: steps.creds.outputs.available == 'true'
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: cargo run --locked -p jamstream-cli --release -- sweep --dry-run --provider digitalocean
      # Later addition goes here: provision the cheapest real instance,
      # verify boot + handshake + self-termination, then assert a final
      # sweep finds nothing.
      - name: Full launch and destroy smoke (not yet implemented)
        if: steps.creds.outputs.available == 'true'
        run: echo 'Placeholder; full provision/boot/self-terminate/sweep smoke lands in a later change.'
