# Wall-time budget: the push/PR path must land in about 10 minutes, with all
# jobs running in parallel so the slowest single job is the bound. Expected
# wall time per job on a warm Swatinem cache (cold caches pay a one-off
# compile that no job split can avoid):
#
#   lint      ~4 min    fmt + clippy + cargo-deny
#   test      ~6-8 min  unit + property + integration + E2E stories, per OS
#   harness   ~4 min    simulation gate suite (~3 min of test runtime)
#   musl      ~6 min    static server builds (both arches) + verification
#   coverage  ~16 min   instrumented rebuild; runs on pushes to main only so
#                       the PR path never waits on it
#
# The harness gates run as their own parallel job so unit/integration
# feedback lands before the ~3 minute simulation suite finishes. Anything
# that cannot fit the budget lives in nightly.yml, which has none.
#
# Every cargo invocation here passes --locked. cargo-deny audits Cargo.lock,
# so without it the graph that was audited and the graph that was built are
# not provably the same: cargo would quietly resolve a newer version and fix
# the lockfile up in CI instead of failing the pull request. --locked costs
# nothing (it only forbids writing Cargo.lock) and does not affect caching.
name: ci

# A newer push supersedes any still-running ci for the same ref; finishing
# a stale run is pure runner burn.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository. Without an explicit block the jobs
# inherit the repository default, and the artifact uploads use the runner's
# own token rather than GITHUB_TOKEN, so read is all that is ever needed.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # We squash-merge, so the PR title becomes the commit message on main, and
  # release-please builds the changelog from those. A title that is not a
  # conventional commit is not an error anywhere: the PR merges, CI is green,
  # and the change is silently absent from the next release notes. That is
  # exactly what happened before v0.1.2, where nine PRs including the session
  # firewall and the broadcast pipeline were dropped from the changelog and
  # had to be restored by hand. Hence a gate rather than a convention.
  #
  # Seconds to run, so it is not worth its own workflow, and it fails fast
  # while the compile jobs are still warming up.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Passed through env, never interpolated into the script body: a PR
      # title is attacker-controlled text and `${{ }}` inside run: is a shell
      # injection.
      - name: Check the title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -eu
          # Types accepted by release-please's default config, plus the ones
          # this repo already uses in its history (deps).
          TYPES='feat|fix|perf|refactor|docs|chore|test|ci|build|style|revert|deps'
          if printf '%s' "$TITLE" | grep -qE "^($TYPES)(\([a-z0-9,./ -]+\))?!?: .+"; then
            echo "ok: $TITLE"
            exit 0
          fi
          cat >&2 <<MSG
          PR title is not a conventional commit:

            $TITLE

          Because this repo squash-merges, the title becomes the commit
          message on main, and release-please builds the changelog from it.
          A non-conforming title merges fine and then vanishes from the
          release notes, which is why this is enforced rather than asked for.

          Use:  <type>[optional scope][!]: <description>
          Types: $TYPES
          Example: feat: a firewall per session
                   fix(cloud): make the VM bootstrap fail closed

          feat and fix appear in the changelog. Use ! for a breaking change.
          MSG
          exit 1

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Third-party actions are pinned to commits repo-wide, not to tags or
      # branches, and dependabot bumps the pins weekly. The reason starts with
      # the jobs that hold signing secrets (release.yml, sign-smoke.yml) but
      # applies here too: a retargeted ref in this workflow could make a
      # malicious pull request look green on the branch that auto-merges.
      # dtolnay/rust-toolchain is pinned to master, which is append-only, with
      # an explicit `toolchain: stable`; the @stable branch is only master
      # plus that default and it gets force-pushed.
      # Re-pin from: gh api repos/dtolnay/rust-toolchain/git/ref/heads/master
      #              gh api repos/Swatinem/rust-cache/git/ref/tags/v2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
      # Staleness gate. cargo-deny audits Cargo.lock and every cargo
      # invocation in this repo passes --locked, so a lockfile that does not
      # match Cargo.toml turns into a build failure minutes into some other
      # job. This fails in seconds and names the offending dependency. It
      # needs no system libraries, so it runs before the apt step.
      - name: Cargo.lock is current
        run: cargo metadata --locked --format-version 1 > /dev/null
      # libasound2-dev: cpal/alsa-sys. libxkbcommon-dev + libwayland-dev:
      # eframe 0.35 (winit/wayland) build-time requirements on Linux.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libpipewire-0.3-dev libdbus-1-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
      # release.yml's shell helpers live in scripts/; keep them
      # shellcheck-clean (shellcheck is preinstalled on ubuntu runners).
      - name: Shellcheck release scripts
        run: shellcheck scripts/*.sh

  # Unit, property, integration, and E2E story tests, plus a production
  # build of every binary. The harness gate suite runs in its own job below
  # so this one is not serialized behind ~3 minutes of simulation.
  #
  # jamstream-client tests run only on macOS, deliberately:
  #   - The kittest UI snapshot baselines were rendered on macOS; pixel
  #     comparison only holds on the OS that rendered them, so a Linux or
  #     Windows run could never assert against them anyway.
  #   - kittest renders through wgpu, which needs a GPU adapter that
  #     headless ubuntu/windows runners do not reliably provide, and the
  #     crate has no env-var escape hatch we could set without touching
  #     src (off-limits here).
  # So: full workspace on macOS, --exclude jamstream-client elsewhere. The
  # client still COMPILES on all three OSes via clippy --all-targets (lint
  # job, Linux) and the release build below.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libpipewire-0.3-dev libdbus-1-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - if: runner.os == 'macOS'
        run: cargo nextest run --locked --workspace --exclude jamstream-harness
      - if: runner.os != 'macOS'
        run: cargo nextest run --locked --workspace --exclude jamstream-harness --exclude jamstream-client
      # The nextest run above already compiles the cfg(windows) WASAPI
      # exclusive-mode backend (lib and tests, with RUSTFLAGS=-D warnings), so
      # it is the Windows compile gate. Clippy, though, only runs on Linux in
      # the lint job, where that whole module is cfg'd out; lint it here, scoped
      # to the one crate that has Windows-only code.
      - if: runner.os == 'Windows'
        run: cargo clippy --locked -p jamstream-audio-io --all-targets -- -D warnings
      # The snapshot tests drop a human-reviewable PNG of every screen under
      # target/ui-previews/; upload them even when a pixel diff fails, since
      # a failing run is exactly when a human wants to look.
      - if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ui-previews
          path: target/ui-previews/
          if-no-files-found: error

  # Thin-lto release compilation is minutes per os; proving it belongs on
  # main, not on every pr iteration. Breakage here is rare and self-locates.
  release-build:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libpipewire-0.3-dev libdbus-1-dev
      - run: cargo build --locked --workspace --release

  # Simulation harness gates: latency budgets, loss resilience, drift, chaos.
  # ~3 minutes of pure test runtime, and no audio/UI system deps (the harness
  # wires engine + protocol to virtual clocks), so no apt step.
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked -p jamstream-harness
        env:
          # Shared runners are several times slower than a developer
          # machine; the gate catches order-of-magnitude regressions.
          JAMSTREAM_PERF_BUDGET_SECS: "120"


  # Coverage is the slowest job (fully instrumented rebuild), so it runs on
  # pushes to main only; PRs get their signal from the jobs above. The
  # client crate is excluded because its kittest snapshot tests are
  # platform-tied to macOS (see the test job comment).
  coverage:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libpipewire-0.3-dev libdbus-1-dev
      # jamstream-harness is also excluded: its gates assert wall-clock
      # budgets, which instrumentation invalidates by design, and its
      # coverage contribution is redundant with the direct suites the
      # floors below measure.
      - name: Workspace coverage (lcov)
        run: cargo llvm-cov --locked --workspace --exclude jamstream-client --exclude jamstream-harness --lcov --output-path lcov.info
      - name: Coverage summary
        run: |
          {
            echo '## Coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
      # Per-package line-coverage floors. llvm-cov has no per-package report
      # filter, so each floor is its own small invocation with every other
      # crate's files masked out of the report. The floors measure a crate
      # against its OWN tests, which is the point: masking after a
      # `report` over the whole workspace would let one crate's suite prop
      # up another's number.
      #
      # The invocations are cheap because the workspace run above already
      # built every instrumented artifact; each one only re-runs that
      # crate's test binaries and re-merges its profraw. Measured warm on
      # an M-series laptop: broadcast 5 s, cloud 24 s, server 27 s, cli
      # 31 s, so the four crates added here cost about 90 s of the job.
      # Nowhere near the point where the shared build would have to be
      # split out of the floor loop.
      #
      # Floors: 75 for the crates whose suites are mature (protocol,
      # engine, session, cloud at 93 percent measured, broadcast at 99),
      # and a measured floor a few points under current coverage for the
      # two newer ones so the gate is real without being brittle:
      # server measures 89.5 (floor 85), cli measures 84.3-84.5 (floor 80;
      # it moves by about 0.2 between runs).
      #
      # Still without a floor, deliberately: jamstream-client (kittest
      # snapshot baselines are macOS renders, see the test job),
      # jamstream-harness (its gates assert wall-clock budgets that
      # instrumentation invalidates), and jamstream-audio-io (a thin cpal
      # shim; a headless runner has no device to open). The first two are
      # also excluded from the workspace lcov above.
      - name: Enforce per-crate line-coverage floors
        run: |
          all='protocol engine session audio-io cloud server cli client harness broadcast'
          for pair in protocol:75 engine:75 session:75 cloud:75 broadcast:75 server:85 cli:80; do
            crate="${pair%:*}"
            floor="${pair#*:}"
            others=''
            for other in $all; do
              if [ "$other" != "$crate" ]; then
                others="${others:+$others|}$other"
              fi
            done
            echo "::group::jamstream-$crate (floor ${floor} percent)"
            cargo llvm-cov --locked -p "jamstream-$crate" --summary-only \
              --fail-under-lines "$floor" \
              --ignore-filename-regex "crates/($others)/|xtask/"
            echo '::endgroup::'
          done

  # Static musl builds of the session server, both architectures a session
  # VM can be (AWS launches arm64, GCP and DigitalOcean x86_64): these are
  # the artifacts a VM downloads at boot, so they must run on any Linux
  # with no shared libs. Building both here means a dependency that breaks
  # the cross build fails the PR, not the release.
  # jamstreamd takes jamstream-cloud with default-features off, so the
  # gcp-less shape of that crate is what actually ships on every session VM.
  # Nothing built it: #158 gated the modules and left two test files and one
  # in-crate test reaching for providers::gcp, so `--no-default-features`
  # did not compile for weeks while every default-features job stayed green.
  # A configuration nobody builds is a configuration nobody has tested.
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
      - name: The crate as jamstreamd takes it, without gcp
        run: cargo test --locked -p jamstream-cloud --no-default-features --all-targets
      - name: And with every feature on
        run: cargo test --locked -p jamstream-cloud --all-features --all-targets

  musl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
      - run: sudo apt-get update && sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
      - run: cargo build --locked -p jamstream-server --release --target x86_64-unknown-linux-musl
      # See release.yml for why fortify is off: the gnu-targeted cross gcc
      # compiles the vendored C against glibc headers, whose fortify layer
      # emits *_chk symbols musl does not have.
      - run: cargo build --locked -p jamstream-server --release --target aarch64-unknown-linux-musl
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
          CFLAGS_aarch64_unknown_linux_musl: -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0
      # Each binary must be fully static AND actually built for the
      # architecture its name claims; #139 was a machine downloading a
      # binary of the wrong architecture.
      - name: Verify both binaries are fully static and the right arch
        run: |
          set -eu
          for PAIR in "x86_64:x86-64" "aarch64:aarch64"; do
            TARGET="${PAIR%%:*}"
            ELF_ARCH="${PAIR#*:}"
            BIN="target/$TARGET-unknown-linux-musl/release/jamstreamd"
            file "$BIN"
            file "$BIN" | grep -q 'static'
            file "$BIN" | grep -q "$ELF_ARCH"
            # A truly static binary has no NEEDED shared-library entries.
            # (ldd is useless here: it exits zero on static-pie binaries.)
            if readelf -d "$BIN" | grep -q 'NEEDED'; then
              echo "jamstreamd ($TARGET) links shared libraries:" >&2
              readelf -d "$BIN" | grep 'NEEDED' >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: jamstreamd-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/jamstreamd
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: jamstreamd-aarch64-unknown-linux-musl
          path: target/aarch64-unknown-linux-musl/release/jamstreamd
          if-no-files-found: error
