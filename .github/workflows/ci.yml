# Wall-time budget: the push/PR path must land in about 10 minutes, with all
# jobs running in parallel so the slowest single job is the bound. Expected
# wall time per job on a warm Swatinem cache (cold caches pay a one-off
# compile that no job split can avoid):
#
#   changes   seconds   classifies the diff; when it is docs-only (site and
#                       root markdown, site images) the compile jobs skip
#   hygiene   seconds   action pins + shellcheck + the LF gate, on every diff
#   lint      ~4 min    fmt + clippy + cargo-deny
#   test      ~6-8 min  unit + property + integration + E2E stories, per OS
#   harness   ~4 min    simulation gate suite (~3 min of test runtime)
#   musl      ~6 min    static server builds (both arches) + verification
#   coverage  ~16 min   instrumented rebuild; runs on pushes to main only so
#                       the PR path never waits on it
#   required  seconds   the aggregator every other job feeds; see the comment
#                       above it for why it exists
#
# The harness gates run as their own parallel job so unit/integration
# feedback lands before the ~3 minute simulation suite finishes. Anything
# that cannot fit the budget lives in nightly.yml, which has none.
#
# Every cargo invocation here passes --locked. cargo-deny audits Cargo.lock,
# so without it the graph that was audited and the graph that was built are
# not provably the same: cargo would quietly resolve a newer version and fix
# the lockfile up in CI instead of failing the pull request. --locked costs
# nothing (it only forbids writing Cargo.lock) and does not affect caching.
name: ci

# A newer push supersedes any still-running ci for the same ref; finishing
# a stale run is pure runner burn.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository. Without an explicit block the jobs
# inherit the repository default, and the artifact uploads use the runner's
# own token rather than GITHUB_TOKEN, so read is all that is ever needed.
#
# Every checkout below also drops the token instead of leaving it in
# .git/config, where a build script could read it back; nothing in this
# workflow touches the network through git after checkout. The hygiene job
# holds that for the whole repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # A change that only touches prose proves nothing the compile jobs check,
  # so they skip when the whole diff is docs: markdown under site/, markdown
  # at the repository root, and the site's committed images.
  # site/src/install.sh and its siblings are code (the site serves them as
  # real installers and docs-check executes them), and so is any path the
  # patterns have never seen. scripts/classify-diff.sh holds the rules and
  # proves them against known paths on every run.
  #
  # A job skipped by its if: still satisfies branch protection (GitHub
  # counts a skipped required check as passing), so no twin no-op workflow
  # and no protection change is needed. The required aggregator below then
  # checks that skipped-for-docs is the result each gated job reported.
  # docs-check.yml has no gate on purpose: docs are exactly what it checks.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The merge base against the PR's base branch needs history from
          # both sides.
          fetch-depth: 0
      - name: Classify the diff as docs-only or code
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT" = pull_request ]; then
            base=$(git merge-base "origin/$BASE_REF" HEAD)
          else
            # A push compares against the tip it replaced. The first push
            # of a ref and a force push have no reachable before-sha, so
            # they run everything rather than guess.
            base=$BEFORE
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "no usable previous sha (before: '${BEFORE:-none}'); classifying as code"
              echo "docs-only=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          verdict=$(scripts/classify-diff.sh "$base" HEAD)
          echo "verdict: $verdict"
          if [ "$verdict" = docs ]; then
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
          fi

  # We squash-merge, so the PR title becomes the commit message on main, and
  # release-please builds the changelog from those. The gate and the reason
  # for it live in scripts/check-pr-title.sh, which reads the accepted types
  # out of release-please-config.json so the two can never disagree.
  #
  # Seconds to run, so it is not worth its own workflow, and it fails fast
  # while the compile jobs are still warming up.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Passed through env and quoted as an argument, never interpolated into
      # the script body: a PR title is attacker-controlled text and `${{ }}`
      # inside run: is a shell injection.
      - name: Check the title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-pr-title.sh "$TITLE"

  # The text-level gates, split out of lint so they stay on when lint's
  # cargo steps skip for a docs-only diff: a docs PR can commit a CRLF
  # markdown file as easily as a code PR can, and the other two cost
  # seconds. Nothing here needs a toolchain or a cache.
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Every third-party action is pinned to a commit
        run: scripts/check-action-pins.sh
      - name: Every checkout decides what happens to the job token
        run: scripts/check-checkout-credentials.sh
      # release.yml's shell helpers live in scripts/; keep them
      # shellcheck-clean (shellcheck is preinstalled on ubuntu runners).
      - name: Shellcheck the repository scripts
        run: shellcheck scripts/*.sh
      # The title gate reads its accepted types out of release-please-config
      # .json, so exercise it against the real file: a parse that stopped
      # finding the changelog sections, or a section deleted from the config,
      # shows up here rather than on the pull request that renames a type.
      # Every accepted title below is a type this repository has released.
      - name: The PR title gate accepts and rejects
        run: |
          set -eu
          while IFS= read -r title; do
            scripts/check-pr-title.sh "$title" >/dev/null
          done <<'GOOD'
          security(protocol)!: key the version reject on a shared secret
          feat: a firewall per session
          fix(cloud): make the VM bootstrap fail closed
          perf(audio): fewer copies per tick
          deps: rand 0.10 and dalek 3
          revert: the broadcast pipeline
          docs: reword the install page
          chore(main): release 0.1.6
          ci: pin every third-party action
          GOOD
          status=0
          while IFS= read -r title; do
            if scripts/check-pr-title.sh "$title" >/dev/null 2>&1; then
              echo "the gate accepted \"$title\"" >&2
              status=1
            fi
          done <<'BAD'
          Fix the thing
          wip hold
          feat no colon here
          security
          nope(scope): a type with no changelog section
          BAD
          exit $status
      # .gitattributes normalizes everything to LF so the bash steps Windows
      # runners execute and the byte-compare gates keep working; this proves
      # the index stayed normalized after checkouts from misconfigured
      # machines. i/none and i/-text are fine (no line endings, binary).
      - name: Every text file is stored with LF
        run: |
          bad=$(git ls-files --eol | grep -E '^i/(crlf|mixed)' || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "CRLF or mixed line endings in the index; run git add --renormalize ." >&2
            exit 1
          fi

  lint:
    needs: [changes]
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Actions outside the github-owned actions/* namespace are pinned to
      # commits repo-wide, not to tags or branches, and dependabot bumps the
      # pins weekly. The reason starts with the jobs that hold signing secrets
      # (release.yml, sign-smoke.yml) but applies here too: a retargeted ref in
      # this workflow could make a malicious pull request look green on the
      # branch that auto-merges. actions/* stay on their major tags: they are
      # published by the same account that runs the runner, so pinning them
      # buys nothing that owning the runner does not already give away.
      #
      # This comment claimed the pinning was total while two actions,
      # cargo-deny below and taiki-e/install-action, sat on @v2. The claim is
      # what made that hard to see, so the policy is now enforced by
      # scripts/check-action-pins.sh in the hygiene job rather than asserted
      # here.
      #
      # dtolnay/rust-toolchain is pinned to master, which is append-only, with
      # an explicit `toolchain: stable`; the @stable branch is only master
      # plus that default and it gets force-pushed.
      # Re-pin from: gh api repos/dtolnay/rust-toolchain/git/ref/heads/master
      #              gh api repos/Swatinem/rust-cache/git/ref/tags/v2
      #              gh api repos/EmbarkStudios/cargo-deny-action/git/ref/tags/v2
      #              gh api repos/taiki-e/install-action/git/ref/tags/v2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
      # Staleness gate. cargo-deny audits Cargo.lock and every cargo
      # invocation in this repo passes --locked, so a lockfile that does not
      # match Cargo.toml turns into a build failure minutes into some other
      # job. This fails in seconds and names the offending dependency. It
      # needs no system libraries, so it runs before the apt step.
      - name: Cargo.lock is current
        run: cargo metadata --locked --format-version 1 > /dev/null
      # libasound2-dev: cpal/alsa-sys. libxkbcommon-dev + libwayland-dev:
      # eframe 0.35 (winit/wayland) build-time requirements on Linux.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libpipewire-0.3-dev libdbus-1-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # Unit, property, integration, and E2E story tests, plus a production
  # build of every binary. The harness gate suite runs in its own job below
  # so this one is not serialized behind ~3 minutes of simulation.
  #
  # Of the client crate's test binaries, exactly one is macOS-only:
  # ui_snapshots renders pixels through wgpu against baselines rendered on
  # macOS, so a Linux or Windows run could never assert against them, and
  # headless runners lack a reliable adapter anyway. Everything else in the
  # crate (the unit tests and the interaction, runtime, takes, retention,
  # perf, and wizard suites) drives egui headlessly and runs on any OS.
  # This job used to exclude the whole crate off macOS, which let a
  # Windows-only compile break in the crate Windows users actually run
  # merge green and surface on main at the push-gated release build. So:
  # full workspace on macOS, everything but the snapshot binary elsewhere.
  test:
    needs: [changes]
    if: needs.changes.outputs.docs-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The CRT the Windows exes ship with is set by a target-scoped rustflags
    # key in .cargo/config.toml, and a process RUSTFLAGS replaces config
    # rustflags outright rather than appending to them. So the workflow-level
    # -D warnings above would leave every Windows leg compiling the dynamic
    # CRT we deliberately do not ship, and the only gate on the real thing
    # would be the release job's import check. Per-OS and not global: on
    # linux-gnu crt-static means statically linking glibc.
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
    # Recalibrated from 20 when this job's Windows leg took on the client
    # suite, three-crate clippy, and the bench check, roughly doubling its
    # work. The distribution that moved it: 15m29s warm-passing before the
    # exe-resource and persistence deps, then 20m09s, 20m10s, and 20m15s
    # cancelled cold, the last with every step green and only the cache
    # save over the line. Warm runs measure 8 to 15 minutes and never use
    # the headroom.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: clippy
      # cache-on-failure, or a dependency-adding PR can never converge on
      # Windows: the cold build overruns the 20 minute ceiling, cancellation
      # skips the cache save, and every retry is exactly as cold as the
      # first. Saving what the failed run compiled makes the retry warm.
      # The ceiling itself is untouched; it defends steady-state wall time.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
        with:
          cache-on-failure: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libpipewire-0.3-dev libdbus-1-dev
      # ffmpeg is what makes crates/stream's real_ffmpeg test a test. Without it
      # that test returned early and printed PASS, so nothing in CI ever checked
      # H.264/yuv420p, AAC-LC, nal-hrd=cbr, the 2 s keyframe cadence or A/V
      # drift: the fake-host unit tests only assert argv substrings, which
      # cannot tell a flag ffmpeg honoured from one it ignored.
      #
      # It is the PINNED build, not the distro's. A session VM downloads the
      # binary named in crates/cloud/data/media_artifacts.json at boot, so that
      # is the only ffmpeg whose behaviour is a fact about the product, and the
      # difference decided the answer to #248: apt's 6.1.1 and the pinned 7.1.5
      # both deadlocked where 8.1.2 usually did not. A gate on apt's build, or
      # on 8.x, would each have reported something untrue of what ships. The
      # installer verifies the same sha256 the VM does, so a bad pin fails here
      # rather than at somebody's session boot.
      - if: runner.os == 'Linux'
        name: Install the ffmpeg a session VM runs
        run: scripts/install-pinned-ffmpeg.sh "$RUNNER_TEMP/pinned-ffmpeg"
      - if: runner.os == 'Linux'
        run: echo "$RUNNER_TEMP/pinned-ffmpeg" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-nextest
      # JAMSTREAM_PERF_BUDGET_SECS was set only on the harness job, so a
      # wall-clock deadline in any suite that runs here had nothing to scale
      # itself by on a shared runner. That is why the absolute tick gate had to
      # live in the harness suite even though the tighter distribution is here:
      # loopback measures p99 647 us against a 718 us max, against p99 1558 us
      # and a 20084 us max through the full network simulation. Same value as
      # the harness job, so every scaled deadline in the repo agrees on one
      # number.
      - if: runner.os == 'macOS'
        run: cargo nextest run --locked --workspace --exclude jamstream-harness
        env:
          JAMSTREAM_PERF_BUDGET_SECS: "120"
      - if: runner.os != 'macOS'
        run: cargo nextest run --locked --workspace --exclude jamstream-harness -E 'not binary(ui_snapshots)'
        env:
          JAMSTREAM_PERF_BUDGET_SECS: "120"
      # The compile surface nextest leaves dark is exactly the bench
      # targets; everything else compiles in the nextest build or the
      # clippy step below. A workspace-wide --all-targets check here
      # duplicated those builds in another profile and, with the exe
      # resource scripts and persistence deps added, pushed this leg past
      # its 20 minute ceiling; scoping to the bench crates keeps
      # the coverage and drops the duplicate work.
      - if: runner.os == 'Windows'
        run: cargo check --locked --benches -p jamstream-engine -p jamstream-protocol -p jamstream-server -p jamstream-audio-io
      # nextest does not run doctests, and nothing else did either, so a doctest
      # would have compiled on the author's machine and never once in CI (#295).
      # It costs a doc-mode build to find zero of them today, because every
      # fenced block in the workspace is `text` or `console`, and the point is
      # the next one somebody writes: a doctest looks like documentation, so it
      # is exactly the kind of test added without wondering whether CI runs it.
      # Linux only. Doctests here exercise no platform-specific path, so running
      # them three times would buy nothing.
      - if: runner.os == 'Linux'
        name: Run doctests, which nextest does not
        run: cargo test --locked --workspace --doc
      # `cargo xtask fixtures` was invoked by nothing, and its WAV generator is
      # duplicated verbatim into crates/cli/tests/common/mod.rs with "keep them
      # in sync" written in a doc comment and enforced nowhere. The nextest run
      # above has just made the test copy's output under target/fixtures/, so
      # comparing the two byte for byte is the enforcement, and it also proves
      # the xtask still runs.
      #
      # Only the fixtures the cli suite actually asks for exist on the test
      # side, which today is three of the four (the impulse train has no
      # caller), hence the floor rather than an exact count. The real fix is
      # one generator with one caller; that needs crates/cli, so this holds the
      # line until then.
      - if: runner.os == 'Linux'
        name: The xtask fixtures and the test fixtures are the same bytes
        run: |
          set -eu
          cargo run --locked -p xtask -- fixtures
          matched=0
          for f in fixtures/audio/*.wav; do
            mirror="target/fixtures/audio/$(basename "$f")"
            [ -f "$mirror" ] || continue
            if cmp -s "$f" "$mirror"; then
              matched=$((matched + 1))
            else
              echo "$(basename "$f") differs between cargo xtask fixtures and the copy in crates/cli/tests/common/mod.rs; the two generators have drifted apart" >&2
              exit 1
            fi
          done
          echo "$matched fixtures generated identically by both copies"
          test "$matched" -ge 3
      # Clippy only runs on Linux in the lint job, where every cfg(windows)
      # module is cfg'd out; lint them here. Three crates carry Windows-only
      # code: audio-io (the WASAPI backend), cloud (icacls hardening and the
      # tasklist/taskkill process module), and client (reveal, and whatever
      # arrives next in the crate Windows users run).
      - if: runner.os == 'Windows'
        run: cargo clippy --locked -p jamstream-audio-io -p jamstream-cloud -p jamstream-client --all-targets -- -D warnings
      # The snapshot tests drop a human-reviewable PNG of every screen under
      # target/ui-previews/; upload them even when a pixel diff fails, since
      # a failing run is exactly when a human wants to look.
      - if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ui-previews
          path: target/ui-previews/
          if-no-files-found: error

  # Thin-lto release compilation is minutes per os; proving it belongs on
  # main, not on every pr iteration. Breakage here is rare and self-locates.
  release-build:
    needs: [changes]
    if: github.event_name == 'push' && needs.changes.outputs.docs-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Same reason as the test job: config rustflags lose to a process
    # RUSTFLAGS, and this job builds what release.yml builds.
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libpipewire-0.3-dev libdbus-1-dev
      - run: cargo build --locked --workspace --release

  # Simulation harness gates: latency budgets, loss resilience, drift, chaos.
  # ~3 minutes of pure test runtime, and no audio/UI system deps (the harness
  # wires engine + protocol to virtual clocks), so no apt step.
  harness:
    needs: [changes]
    if: needs.changes.outputs.docs-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Same reason as the test job: config rustflags lose to a process
    # RUSTFLAGS.
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-nextest
      # One run again. #282 split this into two so the two wall-clock gates
      # could have the runner to themselves, and .config/nextest.toml now says
      # the same thing where nextest reads it on every path: those tests
      # reserve the whole thread pool, so nextest finishes everything else
      # before starting them and runs nothing beside them. That file is
      # authoritative for which tests are isolated and which publish their
      # output; nothing here duplicates the list. It also covers nightly.yml,
      # which had the same exposure and no fix (#283), and a laptop, which had
      # neither.
      - run: cargo nextest run --locked -p jamstream-harness
        env:
          # Shared runners are several times slower than a developer
          # machine; the gate catches order-of-magnitude regressions.
          JAMSTREAM_PERF_BUDGET_SECS: "120"


  # Coverage is the slowest job (fully instrumented rebuild), so it runs on
  # pushes to main only; PRs get their signal from the jobs above. The
  # client crate is excluded because its kittest snapshot tests are
  # platform-tied to macOS (see the test job comment).
  #
  # It also skips a docs-only push, which every other compile job already
  # did. Alone in this file it had no `needs: [changes]`, so a typo fixed in
  # the README spent 16 instrumented minutes proving nothing; `coverage` is
  # in the aggregator's DOCS_SKIP below so the skip is checked rather than
  # merely allowed.
  coverage:
    needs: [changes]
    if: github.event_name == 'push' && needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The test and harness jobs set this, and so does nightly's e2e; this job
    # did not, so every deadline scaled by it in crates/server, crates/cli and
    # crates/session ran at the 1x laptop budget while llvm instrumentation
    # made this the slowest configuration in CI. Instrumented runs need the
    # multiplier more than anything else here, not less. Same 120 as every
    # other job, on the job rather than on one step because the floor loop
    # below re-runs the tests too.
    env:
      JAMSTREAM_PERF_BUDGET_SECS: "120"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
      # cargo-nextest for the same reason the test and harness jobs install
      # it: the runs below go through `cargo llvm-cov nextest`.
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libpipewire-0.3-dev libdbus-1-dev
      # The pinned ffmpeg for the same reason as the test job: this runs
      # crates/stream's tests too, and real_ffmpeg fails on Linux when the
      # encoder is absent rather than reporting a pass. Instrumentation makes
      # this the job most likely to catch a feed that only just keeps up, which
      # is where the ffmpeg 8 wedge showed itself.
      - name: Install the ffmpeg a session VM runs
        run: scripts/install-pinned-ffmpeg.sh "$RUNNER_TEMP/pinned-ffmpeg"
      - run: echo "$RUNNER_TEMP/pinned-ffmpeg" >> "$GITHUB_PATH"
      # Through nextest, like every other job that runs these tests. Plain
      # `cargo llvm-cov` drives libtest, which reads none of
      # .config/nextest.toml, so on this one path the file's opening claim
      # was false and none of its overrides applied. Two of them matter in
      # this job's scope: tick_cost_at_capacity, the session suite's
      # wall-clock gate, was measured beside a thousand cpu-bound
      # simulations rather than given the machine to itself, and the
      # jamstreamd-uplift group serialized nothing, so the binary rewrite
      # #354 traced to CreateProcess error 216 was free to overlap a spawn
      # again in the server and cli suites. This job is push-gated to main,
      # so what that buys lands on main rather than on the pull request that
      # caused it. (The other two isolated gates live in the harness suite,
      # which this job excludes.)
      #
      # Nothing measured changes. Run both ways over crates/audio-io, the
      # lcov carries the same records for the same files and every one of
      # its 2226 DA lines lands on the same side of hit or miss; only the
      # execution counts move, because nextest gives each test its own
      # process. The floors below read the summary, not the counts.
      #
      # jamstream-harness is also excluded: its gates assert wall-clock
      # budgets, which instrumentation invalidates by design, and its
      # coverage contribution is redundant with the direct suites the
      # floors below measure.
      - name: Workspace coverage (lcov)
        run: cargo llvm-cov nextest --locked --workspace --exclude jamstream-client --exclude jamstream-harness --lcov --output-path lcov.info
      - name: Coverage summary
        run: |
          {
            echo '## Coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
      # Per-package line-coverage floors. llvm-cov has no per-package report
      # filter, so each floor is its own small invocation with every other
      # crate's files masked out of the report. The floors measure a crate
      # against its OWN tests, which is the point: masking after a
      # `report` over the whole workspace would let one crate's suite prop
      # up another's number.
      #
      # The invocations are cheap because the workspace run above already
      # built every instrumented artifact; each one only re-runs that
      # crate's test binaries and re-merges its profraw. Measured warm on
      # an M-series laptop: broadcast 5 s, cloud 24 s, server 27 s, cli
      # 31 s, so those four cost about 90 s of the job, and stream is a
      # fifth invocation of the same shape. Nowhere near the point where
      # the shared build would have to be split out of the floor loop.
      #
      # Floors: 75 for the crates whose suites are mature (protocol,
      # engine, session, cloud at 93 percent measured, broadcast at 99),
      # and a measured floor a few points under current coverage for the
      # newer ones so the gate is real without being brittle:
      # server measures 89.5 (floor 85), cli measures 84.3-84.5 (floor 80;
      # it moves by about 0.2 between runs), stream measures 85.96 from its
      # unit tests (floor 80), audio-io measures 95.89 with its device layer
      # masked (floor 90).
      #
      # jamstream-stream was missing from `all` as well as from the loop,
      # which cost twice: it had no floor of its own, and because it never
      # appeared in another crate's mask, the server links it and stream's
      # uncovered lines counted against the server's 85.
      #
      # Its 85.96 is measured the way this job measures, which is without
      # ffmpeg: the apt line above installs alsa, xkbcommon, wayland,
      # pipewire and dbus and nothing else. The gap is almost all proc.rs
      # at 44.55; everything else in the crate is 90 to 100.
      #
      # audio-io is one file short of measurable, not unmeasurable, so it
      # gets a floor with that file masked instead of an exemption. A
      # headless runner has no device to open and cpal_backend.rs sits at
      # 52.46 because of it; the other nine files are pure logic and measure
      # 95.89 together (resample 99.30, wasapi_policy and bridge 100, format
      # 99.70). The whole crate reads 78.86, which is the number the old
      # exemption pointed at: one file was excusing nine.
      #
      # Still without a floor, deliberately: jamstream-client (kittest
      # snapshot baselines are macOS renders, see the test job) and
      # jamstream-harness (its gates assert wall-clock budgets that
      # instrumentation invalidates). Both are also excluded from the
      # workspace lcov above.
      - name: Enforce per-crate line-coverage floors
        run: |
          all='protocol engine session audio-io cloud server cli client harness broadcast stream'
          for pair in protocol:75 engine:75 session:75 audio-io:90 cloud:75 broadcast:75 server:85 cli:80 stream:80; do
            crate="${pair%:*}"
            floor="${pair#*:}"
            others=''
            for other in $all; do
              if [ "$other" != "$crate" ]; then
                others="${others:+$others|}$other"
              fi
            done
            ignore="crates/($others)/|xtask/"
            # The one file above that a runner with no sound card cannot
            # reach.
            if [ "$crate" = audio-io ]; then
              ignore="$ignore|crates/audio-io/src/cpal_backend\.rs"
            fi
            echo "::group::jamstream-$crate (floor ${floor} percent)"
            cargo llvm-cov nextest --locked -p "jamstream-$crate" --summary-only \
              --fail-under-lines "$floor" \
              --ignore-filename-regex "$ignore"
            echo '::endgroup::'
          done

  # Static musl builds of the session server, both architectures a session
  # VM can be (AWS launches arm64, GCP and DigitalOcean x86_64): these are
  # the artifacts a VM downloads at boot, so they must run on any Linux
  # with no shared libs. Building both here means a dependency that breaks
  # the cross build fails the PR, not the release.
  # jamstreamd takes jamstream-cloud with default-features off, so the
  # gcp-less shape of that crate is what actually ships on every session VM.
  # Nothing built it: #158 gated the modules and left two test files and one
  # in-crate test reaching for providers::gcp, so `--no-default-features`
  # did not compile for weeks while every default-features job stayed green.
  # A configuration nobody builds is a configuration nobody has tested.
  features:
    needs: [changes]
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
      - name: The crate as jamstreamd takes it, without gcp
        run: cargo test --locked -p jamstream-cloud --no-default-features --all-targets
      - name: And with every feature on
        run: cargo test --locked -p jamstream-cloud --all-features --all-targets

  musl:
    needs: [changes]
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
      - run: sudo apt-get update && sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
      - run: cargo build --locked -p jamstream-server --release --target x86_64-unknown-linux-musl
      # See release.yml for why fortify is off: the gnu-targeted cross gcc
      # compiles the vendored C against glibc headers, whose fortify layer
      # emits *_chk symbols musl does not have.
      - run: cargo build --locked -p jamstream-server --release --target aarch64-unknown-linux-musl
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
          CFLAGS_aarch64_unknown_linux_musl: -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0
      # Each binary must be fully static AND actually built for the
      # architecture its name claims; #139 was a machine downloading a
      # binary of the wrong architecture.
      - name: Verify both binaries are fully static and the right arch
        run: |
          set -eu
          for PAIR in "x86_64:x86-64" "aarch64:aarch64"; do
            TARGET="${PAIR%%:*}"
            ELF_ARCH="${PAIR#*:}"
            BIN="target/$TARGET-unknown-linux-musl/release/jamstreamd"
            file "$BIN"
            file "$BIN" | grep -q 'static'
            file "$BIN" | grep -q "$ELF_ARCH"
            # A truly static binary has no NEEDED shared-library entries.
            # (ldd is useless here: it exits zero on static-pie binaries.)
            if readelf -d "$BIN" | grep -q 'NEEDED'; then
              echo "jamstreamd ($TARGET) links shared libraries:" >&2
              readelf -d "$BIN" | grep 'NEEDED' >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: jamstreamd-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/jamstreamd
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: jamstreamd-aarch64-unknown-linux-musl
          path: target/aarch64-unknown-linux-musl/release/jamstreamd
          if-no-files-found: error

  # Branch protection gates on job NAMES, so a job added to this file is
  # non-blocking until someone remembers to add its name there. Everything
  # added since that list was written arrived non-blocking, including
  # `features`, the job that exists because --no-default-features sat broken
  # for weeks behind green CI.
  #
  # This job is the one required context that cannot go stale that way. It
  # depends on every other job here, and it FAILS when this workflow contains
  # a job it was not told about, so a new job blocks the branch from the
  # moment it is added and making one non-blocking is an edit to the list
  # below with a reason beside it: a thing a reviewer sees.
  #
  # `if: always()` is load bearing. A job that is skipped counts as success
  # for branch protection, so an aggregator with any other condition would
  # wave a run through exactly when a dependency did not finish.
  required:
    if: always()
    needs: [pr-title, changes, hygiene, lint, test, release-build, harness, coverage, features, musl]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Every job on the pull-request path is accounted for
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -eu
          # Jobs deliberately outside this gate. Empty, and an entry here
          # wants a reason written above it.
          EXEMPT=''
          # docs-check.yml's jobs. A job cannot depend on another workflow's
          # jobs, so each of those reports its own required context. Listing
          # them here is what makes a job added there fail this one, and the
          # reverse direction catches a deleted job whose required context
          # would otherwise leave the branch permanently unmergeable.
          DOCS_JOBS='cli-docs screenshots site-fonts palette channel-claims install-scripts install-scripts-windows install-scripts-posix'

          # Top-level keys of the `jobs:` block. Deliberately dumb, and it
          # fails on an empty result rather than passing quietly, because a
          # reformat this cannot read is the one way it could stop working.
          job_names() {
            awk '
              /^jobs:[[:space:]]*$/ { injobs = 1; next }
              injobs && /^[^[:space:]#]/ { injobs = 0 }
              injobs && /^  [a-zA-Z0-9_-]+:[[:space:]]*$/ {
                sub(/:.*/, ""); gsub(/[[:space:]]/, ""); print
              }
            ' "$1"
          }

          # Space separated, so the membership tests below can look for a word
          # with a space on either side of it.
          CI_JOBS=$(job_names .github/workflows/ci.yml | tr '\n' ' ')
          FOUND_DOCS=$(job_names .github/workflows/docs-check.yml | tr '\n' ' ')
          # A reformat the awk cannot read would yield nothing and then wave
          # every job through, so the count is the check on the check.
          test "$(printf '%s' "$CI_JOBS" | wc -w)" -ge 10
          test "$(printf '%s' "$FOUND_DOCS" | wc -w)" -ge 5

          GATED=$(printf '%s' "$NEEDS" | jq -r 'keys[]' | tr '\n' ' ')
          echo "gated by this job: $GATED"
          status=0
          for job in $CI_JOBS; do
            case " required $EXEMPT $GATED " in
              *" $job "*) ;;
              *)
                echo "ci.yml job '$job' is not in this job's needs, so it does not block anything. Add it, or add it to EXEMPT with a reason." >&2
                status=1
                ;;
            esac
          done
          for job in $FOUND_DOCS; do
            case " $DOCS_JOBS " in
              *" $job "*) ;;
              *)
                echo "docs-check.yml job '$job' is unknown here. Add it to DOCS_JOBS above and add '$job' to the required contexts in branch protection." >&2
                status=1
                ;;
            esac
          done
          for job in $DOCS_JOBS; do
            case " $FOUND_DOCS " in
              *" $job "*) ;;
              *)
                echo "docs-check.yml has no job '$job' any more, so its required context can never report and nothing can merge. Drop it here and from branch protection." >&2
                status=1
                ;;
            esac
          done
          exit $status
      - name: Every job this event should have run is green
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
        run: |
          set -eu
          # Jobs that run on one event only, so `skipped` is their correct
          # result on the other one and anything else is not. Checking the
          # expected result per event rather than just "nothing failed" is
          # the point: a job that quietly stops running reports skipped, and
          # a gate that accepts any skip would accept that too.
          PUSH_ONLY='coverage release-build'
          PR_ONLY='pr-title'
          # The jobs the changes job turns off when the whole diff is docs.
          # Skipped is their correct result then and a failure any other
          # time; keep this list equal to the jobs whose if: reads
          # docs-only above, in both directions, or the next docs-only run
          # fails here and says which side drifted.
          DOCS_SKIP='lint test release-build harness features musl coverage'
          status=0
          for job in $(printf '%s' "$NEEDS" | jq -r 'keys[]'); do
            result=$(printf '%s' "$NEEDS" | jq -r --arg j "$job" '.[$j].result')
            want=success
            case " $PUSH_ONLY " in
              *" $job "*) [ "$EVENT" = push ] || want=skipped ;;
            esac
            case " $PR_ONLY " in
              *" $job "*) [ "$EVENT" = pull_request ] || want=skipped ;;
            esac
            case " $DOCS_SKIP " in
              *" $job "*) [ "$DOCS_ONLY" != true ] || want=skipped ;;
            esac
            if [ "$result" = "$want" ]; then
              printf 'ok      %-14s %s\n' "$job" "$result"
            else
              printf 'NOT OK  %-14s %s, wanted %s\n' "$job" "$result" "$want" >&2
              status=1
            fi
          done
          exit $status
