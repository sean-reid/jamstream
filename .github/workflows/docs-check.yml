# Keeps the documentation site current by machinery, not discipline:
#
# - cli-docs: the CLI reference pages in site/src/cli/ must mention every
#   flag the built CLI's --help output has, and mention no flag it lacks.
#   A change that touches the argument surface must update the docs in the
#   same change or this job fails.
# - screenshots: the images in site/src/images/ are committed copies of
#   the UI snapshot previews. A change that regenerates the snapshot
#   baselines must run site/copy-previews.sh in the same change or this
#   job fails on the byte-for-byte comparison.
# - install-scripts: the installer scripts the site serves at /install.sh
#   and /install.ps1 (they live in site/src/, which mdBook copies into the
#   built site verbatim) must stay shellcheck-clean and parseable.
# - install-scripts-windows: the PowerShell pair must also survive a real
#   install, smoke, and uninstall on a Windows runner against the latest
#   published release.
# - channel-claims: site/src/download.md's package-managers section must
#   agree with packaging/README.md about which channels are live, and the
#   two strings a user types (the brew tap path, the scoop bucket URL)
#   must match their single sources.
# - palette: crates/client/src/theme.rs is the single source of truth for
#   JamStream's colors. The docs theme's custom properties, the docs
#   theme-color meta, and the app icon's fills are generated from it by
#   scripts/render-palette.sh, and the icon's derived assets (icns, ico,
#   the tarball PNG, the favicons) by scripts/render-icon.sh. A palette
#   change that has not reached either of them fails this job.

name: docs-check

on:
  push:
    branches: [main]
  pull_request:

# Every job here only reads the tree and compares generated output against
# what is committed. Nothing writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cli-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
        with:
          shared-key: docs-check-cli
      - name: Check CLI reference pages against --help
        run: site/check-cli-docs.sh

  screenshots:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
        with:
          shared-key: docs-check-previews
      # target/ui-previews/publishable.txt is opened with append(true) and never
      # truncated (crates/client/tests/ui_snapshots.rs), so a fixture demoted
      # out of snapshot_for_docs, which is the act of saying an image no longer
      # shows the product honestly, keeps passing against the stale entry left
      # by an earlier run. Whether the cache ever carries that directory across
      # runs is not something this job should have to be sure of, so delete it
      # and let the render below be the only thing that writes the manifest.
      #
      # This closes the CI half only. The real fix is truncating on the first
      # write, which is in the client crate.
      - name: Clear last run's previews and manifest
        run: rm -rf target/ui-previews
      - name: Render UI previews
        run: cargo test --locked -p jamstream-client --test ui_snapshots
      - name: Check committed docs images against fresh previews
        run: site/copy-previews.sh --check

  palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck the palette and icon generators
        run: shellcheck scripts/render-palette.sh scripts/render-icon.sh
      - name: Check the generated palette consumers against theme.rs
        run: scripts/render-palette.sh --check
      # render-palette leaves jamstream.svg recoloured; the assets rendered
      # FROM it (icns, ico, jamstream-512.png, the two favicons) were the half
      # nothing checked, so a recolour shipped old-coloured icons with this job
      # green. --check needs no rendering tools, which is why it runs here on
      # ubuntu rather than needing a macOS runner.
      - name: Check the derived icon assets against the icon
        run: scripts/render-icon.sh --check

  # The download page's claims about package channels, against
  # packaging/README.md (whose per-channel sections say what is live) and
  # the two strings a user actually types: the brew tap path, defined in
  # the README and echoed by the rendered manifests, and the scoop bucket
  # URL, defined by release.yml's BUCKET_REPO. The page said no package
  # manager was live while the tap had been shipping for weeks (#362).
  channel-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the download page against the channel claims
        run: scripts/check-channel-claims.sh

  install-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck the POSIX installer and uninstaller
        run: shellcheck site/src/install.sh site/src/uninstall.sh
      - name: Parse the PowerShell installer and uninstaller
        run: |
          pwsh -NoProfile -Command '
            foreach ($script in "site/src/install.ps1", "site/src/uninstall.ps1") {
              $tokens = $null; $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                $script, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                $errors | ForEach-Object { Write-Output $_.ToString() }
                exit 1
              }
              Write-Output "$script parses cleanly"
            }'

  # The parse above runs on ubuntu, where the only branch these scripts can
  # reach is the "this is not Windows" early exit; nothing ever executed
  # their happy path on any OS. This job runs them for real against the
  # latest published release: lint, install, run the installed CLI,
  # uninstall, and assert the directory is gone. It is also the gate that
  # pins the asset names install.ps1 downloads to what release.yml actually
  # uploaded.
  install-scripts-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Error severity only: the scripts talk to the user through
      # Write-Host, which the Warning set flags by design.
      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $failed = $false
          foreach ($script in 'site/src/install.ps1', 'site/src/uninstall.ps1') {
            $findings = Invoke-ScriptAnalyzer -Path $script -Severity Error
            if ($findings) { $findings | Format-Table -AutoSize | Out-String | Write-Output; $failed = $true }
            else { Write-Output "$script analyzes cleanly" }
          }
          if ($failed) { exit 1 }
      - name: Install, run, and uninstall against the latest release
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'jamstream-install-check'
          powershell -ExecutionPolicy Bypass -File site/src/install.ps1 -InstallDir $dir
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited $LASTEXITCODE" }
          & (Join-Path $dir 'jamstream.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "installed jamstream.exe exited $LASTEXITCODE" }
          powershell -ExecutionPolicy Bypass -File site/src/uninstall.ps1 -InstallDir $dir -Yes
          if ($LASTEXITCODE -ne 0) { throw "uninstall.ps1 exited $LASTEXITCODE" }
          if (Test-Path (Join-Path $dir 'jamstream.exe')) { throw 'uninstall left jamstream.exe behind' }
