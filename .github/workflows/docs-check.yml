# Keeps the documentation site current by machinery, not discipline:
#
# - cli-docs: the CLI reference pages in site/src/cli/ must mention every
#   flag the built CLI's --help output has, and mention no flag it lacks.
#   A change that touches the argument surface must update the docs in the
#   same change or this job fails.
# - screenshots: the images in site/src/images/ are committed copies of
#   the UI snapshot previews. A change that regenerates the snapshot
#   baselines must run site/copy-previews.sh in the same change or this
#   job fails on the byte-for-byte comparison.
# - install-scripts: the installer scripts the site serves at /install.sh
#   and /install.ps1 (they live in site/src/, which mdBook copies into the
#   built site verbatim) must stay shellcheck-clean and parseable.
# - install-scripts-windows and install-scripts-posix: each pair must also
#   survive a real install, smoke, and uninstall on a runner of its own
#   platform, against the newest release that has finished uploading its
#   assets.
# - prose: no paragraph or list item on the site runs past 320 characters
#   and no list past 12 items. A wall of text is what stops somebody
#   reading a reference page, and per-page word count does not measure it.
# - site-fonts: the theme's fonts are copies of fonts/ at the root of the
#   tree. A change to those must run site/copy-fonts.sh in the same change
#   or this job fails, and a build of the book proves the fonts reach it.
# - channel-claims: site/src/download.md's package-managers section must
#   agree with packaging/README.md about which channels are live, and the
#   two strings a user types (the brew tap path, the scoop bucket URL)
#   must match their single sources.
# - palette: crates/client/src/theme.rs is the single source of truth for
#   JamStream's colors. The docs theme's custom properties, the docs
#   theme-color meta, and the app icon's fills are generated from it by
#   scripts/render-palette.sh, and the icon's derived assets (icns, ico,
#   the tarball PNG, the favicons) by scripts/render-icon.sh. A palette
#   change that has not reached either of them fails this job.

name: docs-check

on:
  push:
    branches: [main]
  pull_request:

# Every job here only reads the tree and compares generated output against
# what is committed. Nothing writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cli-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
        with:
          shared-key: docs-check-cli
      - name: Check CLI reference pages against --help
        run: site/check-cli-docs.sh

  screenshots:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
        with:
          shared-key: docs-check-previews
      # The manifest is now truncated by the run's first snapshot_for_docs
      # (crates/client/tests/ui_snapshots.rs), so a stale entry cannot survive
      # into the check below. The PNGs themselves are still whatever the last
      # run left, and a preview file for a fixture that no longer exists would
      # let a deleted image stay published, so the directory still goes.
      - name: Clear last run's previews
        run: rm -rf target/ui-previews
      - name: Render UI previews
        run: cargo test --locked -p jamstream-client --test ui_snapshots
      - name: Check committed docs images against fresh previews
        run: site/copy-previews.sh --check

  # The theme's fonts are copies of fonts/ at the root of the tree, which is
  # the one set the app and the stream card also embed. They were symlinks
  # until #425: a Windows clone writes those as text files holding the target
  # path, mdBook copies them into the book as fonts, and the browser falls
  # back with nothing reporting an error. The copies are what CI can see, so
  # this job proves they still match their source and that a real build ships
  # the bytes themselves rather than anything standing in for them.
  prose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 site/check-prose.py

  site-fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Shellcheck the site scripts
        run: shellcheck site/*.sh
      - name: Check the theme fonts against the tree's fonts
        run: site/copy-fonts.sh --check
      # pages.yml pins the version that builds what people read, so it is the
      # one place the pin lives.
      - name: Install mdbook, the version pages.yml pins
        run: |
          set -eu
          version=$(sed -n 's/^ *MDBOOK_VERSION: *//p' .github/workflows/pages.yml | head -1)
          [ -n "$version" ] || { echo "::error::no MDBOOK_VERSION in pages.yml"; exit 1; }
          echo "mdbook $version"
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${version}/mdbook-v${version}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the book
        run: mdbook build site
      - name: The built book carries the fonts themselves
        run: |
          set -eu
          for theme in site/theme/fonts/*.ttf; do
            name=$(basename "$theme")
            built="site/book/fonts/$name"
            [ -f "$built" ] || { echo "::error::the built book has no $built"; exit 1; }
            cmp "fonts/$name" "$built"
            echo "$built matches fonts/$name"
          done

  palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Shellcheck the palette and icon generators
        run: shellcheck scripts/render-palette.sh scripts/render-icon.sh
      - name: Check the generated palette consumers against theme.rs
        run: scripts/render-palette.sh --check
      # render-palette leaves jamstream.svg recoloured; the assets rendered
      # FROM it (icns, ico, jamstream-512.png, the two favicons) were the half
      # nothing checked, so a recolour shipped old-coloured icons with this job
      # green. --check needs no rendering tools, which is why it runs here on
      # ubuntu rather than needing a macOS runner.
      - name: Check the derived icon assets against the icon
        run: scripts/render-icon.sh --check

  # The download page's claims about package channels, against
  # packaging/README.md (whose per-channel sections say what is live) and
  # the two strings a user actually types: the brew tap path, defined in
  # the README and echoed by the rendered manifests, and the scoop bucket
  # URL, defined by release.yml's BUCKET_REPO. The page said no package
  # manager was live while the tap had been shipping for weeks (#362).
  channel-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the download page against the channel claims
        run: scripts/check-channel-claims.sh

  install-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Shellcheck the POSIX installer and uninstaller
        run: shellcheck site/src/install.sh site/src/uninstall.sh
      - name: Parse the PowerShell installer and uninstaller
        run: |
          pwsh -NoProfile -Command '
            foreach ($script in "site/src/install.ps1", "site/src/uninstall.ps1") {
              $tokens = $null; $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                $script, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                $errors | ForEach-Object { Write-Output $_.ToString() }
                exit 1
              }
              Write-Output "$script parses cleanly"
            }'

  # The parse above runs on ubuntu, where the only branch these scripts can
  # reach is the "this is not Windows" early exit; nothing ever executed
  # their happy path on any OS. This job runs them for real against a real
  # release: lint, install, run the installed CLI, uninstall, and assert the
  # directory is gone. It is also the gate that pins the asset names
  # install.ps1 downloads to what release.yml actually uploaded.
  #
  # Which release it installs, and why that is not simply the newest one,
  # is scripts/newest-release-tag.sh.
  install-scripts-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Error severity only: the scripts talk to the user through
      # Write-Host, which the Warning set flags by design.
      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $failed = $false
          foreach ($script in 'site/src/install.ps1', 'site/src/uninstall.ps1') {
            $findings = Invoke-ScriptAnalyzer -Path $script -Severity Error
            if ($findings) { $findings | Format-Table -AutoSize | Out-String | Write-Output; $failed = $true }
            else { Write-Output "$script analyzes cleanly" }
          }
          if ($failed) { exit 1 }
      # The newest release that finished uploading, which is what -Tag exists
      # for. The POSIX job below resolves it with the same script.
      - name: Find the newest complete release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=$(scripts/newest-release-tag.sh)
          echo "checking the scripts against $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install, run, and uninstall against that release
        shell: powershell
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'jamstream-install-check'
          powershell -ExecutionPolicy Bypass -File site/src/install.ps1 -Tag $env:TAG -InstallDir $dir
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited $LASTEXITCODE" }
          & (Join-Path $dir 'jamstream.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "installed jamstream.exe exited $LASTEXITCODE" }
          powershell -ExecutionPolicy Bypass -File site/src/uninstall.ps1 -InstallDir $dir -Yes
          if ($LASTEXITCODE -ne 0) { throw "uninstall.ps1 exited $LASTEXITCODE" }
          if (Test-Path (Join-Path $dir 'jamstream.exe')) { throw 'uninstall left jamstream.exe behind' }

  # The same treatment for the pair most people run. Until this existed, the
  # POSIX scripts were shellchecked and nothing more, so a change that left
  # install.sh parseable but broken merged green on both platforms it serves
  # while Windows got a real install (#422). Both runners are here because
  # the two differ in the asset they fetch, the checksum tool they find, and
  # the data directory the uninstaller reports.
  install-scripts-posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Find the newest complete release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=$(scripts/newest-release-tag.sh)
          echo "checking the scripts against $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # A directory of its own rather than a default one, so the run cannot
      # depend on what else the image has in /usr/local/bin and so the
      # uninstaller has exactly one binary to find.
      - name: Install, run, and uninstall against that release
        env:
          TAG: ${{ steps.release.outputs.tag }}
          JAMSTREAM_INSTALL_DIR: ${{ runner.temp }}/jamstream-install-check
        run: |
          set -eu
          sh site/src/install.sh --tag "$TAG"
          "$JAMSTREAM_INSTALL_DIR/jamstream" --version
          sh site/src/uninstall.sh --yes
          if [ -e "$JAMSTREAM_INSTALL_DIR/jamstream" ]; then
            echo "::error::uninstall.sh left the binary behind"
            exit 1
          fi
