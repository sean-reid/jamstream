# Keeps the documentation site current by machinery, not discipline:
#
# - cli-docs: the CLI reference pages in site/src/cli/ must mention every
#   flag the built CLI's --help output has, and mention no flag it lacks.
#   A change that touches the argument surface must update the docs in the
#   same change or this job fails.
# - screenshots: the images in site/src/images/ are committed copies of
#   the UI snapshot previews. A change that regenerates the snapshot
#   baselines must run site/copy-previews.sh in the same change or this
#   job fails on the byte-for-byte comparison.
# - install-scripts: the installer scripts the site serves at /install.sh
#   and /install.ps1 (they live in site/src/, which mdBook copies into the
#   built site verbatim) must stay shellcheck-clean and parseable.
# - palette: crates/client/src/theme.rs is the single source of truth for
#   JamStream's colors. The docs theme's custom properties, the docs
#   theme-color meta, and the app icon's fills are generated from it by
#   scripts/render-palette.sh. A change to a palette value that is not
#   propagated (run the script, then scripts/render-icon.sh when the icon
#   moved) fails this job.

name: docs-check

on:
  push:
    branches: [main]
  pull_request:

# Every job here only reads the tree and compares generated output against
# what is committed. Nothing writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cli-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
        with:
          shared-key: docs-check-cli
      - name: Check CLI reference pages against --help
        run: site/check-cli-docs.sh

  screenshots:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2.9.1)
        with:
          shared-key: docs-check-previews
      - name: Render UI previews
        run: cargo test --locked -p jamstream-client --test ui_snapshots
      - name: Check committed docs images against fresh previews
        run: site/copy-previews.sh --check

  palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck the palette and icon generators
        run: shellcheck scripts/render-palette.sh scripts/render-icon.sh
      - name: Check the generated palette consumers against theme.rs
        run: scripts/render-palette.sh --check

  install-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck the POSIX installer
        run: shellcheck site/src/install.sh
      - name: Parse the PowerShell installer and uninstaller
        run: |
          pwsh -NoProfile -Command '
            foreach ($script in "site/src/install.ps1", "site/src/uninstall.ps1") {
              $tokens = $null; $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                $script, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                $errors | ForEach-Object { Write-Output $_.ToString() }
                exit 1
              }
              Write-Output "$script parses cleanly"
            }'
