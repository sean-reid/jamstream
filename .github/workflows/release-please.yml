# Release automation. release-please watches main, keeps a release PR open
# with the changelog and version bump, and cuts a tag + GitHub Release when
# that PR merges. release.yml then attaches the build artifacts.
#
# Versioning: plain semver from 0.x. A major version of zero already says
# pre-1.0, expect changes, so a -beta label alongside it was redundant and
# it cost us the standard /releases/latest/download endpoint that the
# installer, the download page, and every package manifest rely on
# (GitHub's latest-release excludes prereleases). Releases are therefore
# normal releases, not GitHub prereleases, and 1.0 will be a deliberate
# decision rather than a label falling off.
name: release-please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  # Holds contents: write so release-please can push the tag and cut the
  # release. Deliberately does NOT hold actions: write; see dispatch-release.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Pinned to the v5.0.0 commit rather than the v5 tag, which is mutable.
      # A retargeted v5 would run attacker code in a job that can push a tag,
      # and the dispatch below would then have release.yml sign and notarize
      # whatever that tag points at. SHA256SUMS comes out of the same
      # pipeline, so it would certify the result rather than catch it.
      # Re-pin from: gh api repos/googleapis/release-please-action/tags
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # A fine-grained token scoped to this repository, contents and pull
          # requests only. Not GITHUB_TOKEN: this repository's Actions policy
          # holds a run whose actor is github-actions[bot] at action_required,
          # so the release pull request arrives with no checks and waits for a
          # human to close and reopen it. This token's actor is sean-reid,
          # which the policy does not gate. The permissions above still bound
          # what the job itself can do.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps [workspace.package].version in Cargo.toml and
      # leaves Cargo.lock naming the old version for every workspace crate.
      # ci.yml runs `cargo metadata --locked`, so the release pull request
      # fails its own version bump. Switching to the rust release type did not
      # help: this root manifest is virtual, so there is no [package] version
      # for that strategy to find.
      #
      # So refresh the lock on the release branch. `--workspace` re-resolves
      # only the workspace members, and the guard below fails the job if
      # anything else moved, because a release is the last place a dependency
      # should change without anyone asking for it.
      - if: steps.release.outputs.pr
        uses: actions/checkout@v7
        with:
          # The one checkout in the repository that keeps the token: the step
          # below commits the refreshed lockfile and pushes it back to the
          # release branch. It takes the same token as the action above for the
          # same reason: a push credited to github-actions[bot] leaves the
          # branch's checks at action_required.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          persist-credentials: true
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
      - if: steps.release.outputs.pr
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - if: steps.release.outputs.pr
        name: Refresh Cargo.lock for the version bump
        run: |
          set -eu
          cargo update --workspace
          if git diff --quiet Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          if git diff -U0 Cargo.lock | grep -E '^[-+]name = ' | grep -qv 'name = "jamstream'; then
            echo "::error::refreshing the lockfile moved a non-workspace crate; refusing" >&2
            git diff Cargo.lock >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: refresh Cargo.lock for the version bump"
          git push

  # Events published with the workflow token do not trigger workflows
  # (recursion guard), so the artifact build is chained by explicit dispatch,
  # which is the sanctioned exception.
  #
  # This is a separate job so that actions: write, which can start any
  # workflow in the repository, is never held by the job that runs the
  # third-party release-please action. The two permissions together are the
  # whole attack: push a tag, then dispatch the notarizing build at it.
  dispatch-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          # Bound to env rather than interpolated into the command, so a tag
          # name is never shell input.
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" -f "tag=$TAG"
