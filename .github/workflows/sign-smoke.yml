# A weekly canary for the whole trusted-distribution chain, not just for
# the certificate. It exists because release.yml deliberately SKIPS
# notarization with a warning when the ASC secrets are absent: a revoked,
# deleted, or expired notary key would otherwise ship an un-notarized
# release quietly, and users would meet Gatekeeper again with nothing
# having failed. So this job signs a real binary and then actually
# notarizes it, asserting Accepted, which is the only way to know the
# credentials still work before a release depends on them.
name: sign-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"

# This job holds the Developer ID certificate and the notary key, so its
# GITHUB_TOKEN should be able to do as little as possible. It only needs to
# check out the tree it signs.
permissions:
  contents: read

jobs:
  sign:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A deleted, rotated-away, or renamed APPLE_CERT_P12 is the exact case
      # this workflow exists for, and it used to be the one case it could not
      # see: an empty secret published configured=false, every later step
      # skipped on that output, and the job went green on an echo. So an absent
      # certificate now fails, naming what is missing, and the steps below are
      # unconditional.
      #
      # That does mean a fork dispatching this workflow gets a red run. It is
      # the honest answer: with no certificate there is nothing here to smoke
      # test, and a green tick would claim the chain is fine.
      - name: The signing secrets exist
        env:
          CERT: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -eu
          missing=''
          [ -n "$CERT" ] || missing="$missing APPLE_CERT_P12"
          [ -n "$CERT_PASSWORD" ] || missing="$missing APPLE_CERT_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Signing secrets are missing:$missing. Releases would ship unsigned, which is the failure this workflow watches for. Set them, or delete this workflow if the project has stopped signing."
            exit 1
          fi
          echo "certificate and password are both present"
      # Commit pins, per the policy documented in ci.yml. It matters most
      # here: this job holds the Developer ID certificate and the notary key,
      # so anything a retargeted @stable branch or @v2 tag ran could read both
      # out of the environment.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (2.9.1)
      # The same fetch-then-build-offline shape release.yml uses, so this
      # canary exercises that too, not just the certificate.
      - run: cargo fetch --locked
      - run: cargo build --locked --offline -p jamstream-client --release
      - name: Import certificate into a throwaway keychain
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -eu
          # KEYCHAIN_PW stays a shell local. It used to be written to
          # $GITHUB_ENV, which is not log-masked, and no later step ever read
          # it back.
          KEYCHAIN_PW=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PW" smoke.keychain
          security set-keychain-settings -lut 1800 smoke.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" smoke.keychain
          printf '%s' "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k smoke.keychain \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PW" smoke.keychain > /dev/null
          security list-keychains -d user -s smoke.keychain login.keychain
      - name: Sign and verify
        run: |
          set -eu
          IDENTITY=$(security find-identity -v -p codesigning smoke.keychain \
            | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "no valid signing identity in the imported certificate" >&2
            exit 1
          fi
          echo "signing with: $IDENTITY"
          BIN=target/release/jamstream-app
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" --keychain smoke.keychain "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          codesign --display --verbose=2 "$BIN" 2>&1 | grep -E "Authority|TeamIdentifier"
      # The notary credentials are the half that can lapse without anything
      # failing loudly, so exercise them for real: a signed binary in a zip
      # is a valid submission and takes a couple of minutes to clear.
      - name: Check notarization credentials
        id: notary
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eu
          if [ -n "$ASC_KEY_P8" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$ASC_KEY_P8" ] || [ -n "$ASC_KEY_ID" ] || [ -n "$ASC_ISSUER_ID" ]; then
            echo "::error::Notarization secrets are PARTIALLY configured; a release would fail." >&2
            exit 1
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NOTARIZATION CREDENTIALS ABSENT: releases are shipping signed but not notarized, so first launch shows a Gatekeeper warning. Set ASC_KEY_P8, ASC_KEY_ID, and ASC_ISSUER_ID."
          fi
      - if: steps.notary.outputs.configured == 'true'
        name: Notarize the signed binary
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eu
          # Shell redirection creates 0666 & ~umask, and the runner umask is
          # 022, so without this the notary private key lands 0644.
          umask 077
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc-key.p8"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc-key.p8"
          fi
          ditto -c -k target/release/jamstream-app "$RUNNER_TEMP/smoke.zip"
          xcrun notarytool submit "$RUNNER_TEMP/smoke.zip" \
            --key "$RUNNER_TEMP/asc-key.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait | tee "$RUNNER_TEMP/notary.log"
          rm -f "$RUNNER_TEMP/asc-key.p8"
          grep -q "status: Accepted" "$RUNNER_TEMP/notary.log"
      # The step above removes the key on its happy path only, so a notarytool
      # failure would leave the notary private key sitting in RUNNER_TEMP for
      # the rest of the job. Unconditional scrub.
      - if: always()
        name: Scrub the notarization key
        run: rm -f "$RUNNER_TEMP/asc-key.p8" "$RUNNER_TEMP/smoke.zip"
      - if: always()
        name: Remove the throwaway keychain
        run: security delete-keychain smoke.keychain || true
