[package]
name = "jamstream-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
jamstream-protocol.workspace = true
jamstream-engine.workspace = true
blake2.workspace = true
ed25519-dalek.workspace = true
thiserror.workspace = true
tracing.workspace = true
# `testing` only, and optional so the sans-io crate stays sans-runtime for
# everything that ships: the shared socket pump is the one item here that
# awaits.
tokio = { workspace = true, optional = true }

[features]
# Re-exports the avatar reassembly internals so the fuzz workspace can drive
# them without a handshake. No shipped build enables it.
fuzzing = []
# The socket pump the server and cli integration suites drive a real
# `ClientCore` with. Consumers ask for it in their dev-dependencies
# (jamstream-server, jamstream-cli); no shipped build enables it.
testing = ["dep:tokio"]

[dev-dependencies]
# A version reject can only be drawn by a readable init this build refuses.
jamstream-protocol = { workspace = true, features = ["testing"] }
# Tests only: the broadcast renderer cards musicians, so its card cap and this
# crate's musician cap are one fact with no dependency path between them. See
# the test beside MAX_MUSICIANS in src/limits.rs (#232).
jamstream-broadcast.workspace = true
proptest.workspace = true
# Loopback tests scan the bytes the server actually seals.
postcard.workspace = true
