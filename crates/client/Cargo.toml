[package]
name = "jamstream-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "jamstream_client"
path = "src/lib.rs"

[[bin]]
name = "jamstream-app"
path = "src/main.rs"

[dependencies]
jamstream-protocol.workspace = true
jamstream-session.workspace = true
jamstream-audio-io.workspace = true
# gcp: this surface launches GCP sessions, so it wants the RSA signing
# jamstreamd does without.
jamstream-cloud = { workspace = true, features = ["gcp"] }
jamstream-cli.workspace = true
# The platform catalog: display names, per-platform key guidance, and the
# encode's bitrate. The app draws no stream frames and spawns no ffmpeg; it
# reads the same data file the server does so the two cannot disagree about
# which platforms ship.
jamstream-stream.workspace = true
# Facts the stream card and the app's own widgets share, and must not hold two
# copies of: the meter law in decibels and seconds, and the avatar dimension
# cap. The app still draws no stream frames; it reads those constants. Free in
# the binary either way, because jamstream-stream links this crate already.
jamstream-broadcast.workspace = true
# Hex and base64. The CLI state file's key fields are written with this
# codec on the CLI's side, and the app reads them back, so both halves of
# that file go through one implementation.
data-encoding.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
image.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
keyring.workspace = true
tokio.workspace = true
# Wipes a typed stream key out of the entry field's allocation, rather than
# leaving it in freed memory after a String::clear.
zeroize.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
jamstream-server.workspace = true
hound.workspace = true

[build-dependencies]
winresource.workspace = true
