[package]
name = "jamstream-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "jamstream_client"
path = "src/lib.rs"

[[bin]]
name = "jamstream-app"
path = "src/main.rs"

[dependencies]
jamstream-protocol.workspace = true
jamstream-session.workspace = true
jamstream-audio-io.workspace = true
# gcp: this surface launches GCP sessions, so it wants the RSA signing
# jamstreamd does without.
jamstream-cloud = { workspace = true, features = ["gcp"] }
jamstream-cli.workspace = true
# The platform catalog: display names, per-platform key guidance, and the
# encode's bitrate. The app draws no stream frames and spawns no ffmpeg; it
# reads the same data file the server does so the two cannot disagree about
# which platforms ship.
jamstream-stream.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
image.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
dirs.workspace = true
keyring.workspace = true
tokio.workspace = true
# Wipes a typed stream key out of the entry field's allocation, rather than
# leaving it in freed memory after a String::clear.
zeroize.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
# Test-only: the initials disc must hash a name to the same hue here and on
# the stream card, and the only honest way to assert that is against the
# broadcast renderer itself. The app never draws stream frames, so this is
# not a runtime dependency.
jamstream-broadcast.workspace = true
jamstream-server.workspace = true
hound.workspace = true
