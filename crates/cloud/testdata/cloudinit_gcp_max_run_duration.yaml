#cloud-config
write_files:
  - path: /etc/jamstream/config
    owner: root:root
    permissions: "0600"
    content: |
      session_id_hex = deadbeefcafef00d
      port = 43210
      server_private_key_b64 = c2VydmVyLXByaXZhdGUta2V5
      issuer_public_key_b64 = aXNzdWVyLXB1YmxpYy1rZXk=
      idle_shutdown_min = 10
      max_duration_min = 720
  - path: /usr/local/sbin/jamstream-self-destruct
    owner: root:root
    permissions: "0700"
    content: |
      #!/bin/sh
      # The hard cap is provider-enforced (maxRunDuration with
      # instanceTerminationAction=DELETE). This script is the idle path: delete
      # the instance with the scoped service account token from metadata.
      echo "jamstream self-destruct: $1" > /dev/console 2>/dev/null || true
      md=http://metadata.google.internal/computeMetadata/v1
      name=$(curl -fsS -H 'Metadata-Flavor: Google' "$md/instance/name")
      zone=$(curl -fsS -H 'Metadata-Flavor: Google' "$md/instance/zone")
      token=$(curl -fsS -H 'Metadata-Flavor: Google' \
        "$md/instance/service-accounts/default/token" \
        | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
      curl -fsS -X DELETE -H "Authorization: Bearer $token" \
        "https://compute.googleapis.com/compute/v1/$zone/instances/$name" \
        || poweroff
  - path: /usr/local/sbin/jamstream-guard
    owner: root:root
    permissions: "0700"
    content: |
      #!/bin/sh
      # Dead man's switch. jamstreamd touches /run/jamstream/last-active while
      # musicians are connected; staleness past the idle window, or exceeding the
      # session hard cap, triggers self-destruct.
      set -eu
      now=$(date +%s)
      boot=$((now - $(cut -d. -f1 /proc/uptime)))
      last=$(stat -c %Y /run/jamstream/last-active 2>/dev/null || echo "$boot")
      if [ $((now - last)) -ge 600 ]; then
        exec /usr/local/sbin/jamstream-self-destruct "idle for $((now - last))s"
      fi
      if [ $((now - boot)) -ge 43200 ]; then
        exec /usr/local/sbin/jamstream-self-destruct "max session duration reached"
      fi
  - path: /usr/local/sbin/jamstream-bootstrap
    owner: root:root
    permissions: "0700"
    content: |
      #!/bin/sh
      set -eu
      mkdir -p /run/jamstream
      touch /run/jamstream/last-active
      # Stream keys are staged here for the instant it takes to spawn a pusher.
      # /run is tmpfs, so nothing reaches persistent disk.
      mkdir -p /run/jamstream/keys
      chmod 0700 /run/jamstream/keys
      # A pusher's ffmpeg receives its ingest URL on stdin, but execs with it in
      # argv, so hide other processes' command lines from non-root. The VM has no
      # other users; this is the belt.
      mount -o remount,hidepid=2 /proc 2>/dev/null || true
      curl -fsSL --retry 5 -o /usr/local/bin/jamstreamd.download "https://github.com/sean-reid/jamstream/releases/download/v0.1.0/jamstreamd-x86_64-unknown-linux-musl"
      if ! echo "0f2e5c1d3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d  /usr/local/bin/jamstreamd.download" | sha256sum -c -; then
        echo "jamstream: artifact sha256 mismatch, refusing to start" >&2
        rm -f /usr/local/bin/jamstreamd.download
        exit 1
      fi
      mv /usr/local/bin/jamstreamd.download /usr/local/bin/jamstreamd
      chmod 0755 /usr/local/bin/jamstreamd
      # Only the session UDP port is reachable from outside.
      if command -v ufw >/dev/null 2>&1; then
        ufw default deny incoming
        ufw allow 43210/udp
        ufw --force enable
      else
        iptables -A INPUT -i lo -j ACCEPT
        iptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        iptables -A INPUT -p udp --dport 43210 -j ACCEPT
        iptables -P INPUT DROP
      fi
      systemctl daemon-reload
      # The session server comes up first: musicians are waiting, and the broadcast
      # tooling is only needed once the host goes live.
      systemctl enable --now jamstreamd.service
      systemctl enable --now jamstream-guard.timer
      # Broadcast subprocesses, pinned and checksummed like everything else.
      tmp=$(mktemp -d)
      # ffmpeg n7.1.5-10-g2aefd64d48, GPL-3.0-or-later. Pinned in data/media_artifacts.json.
      # JamStream never links it, only spawns it, which is what keeps the
      # copyleft obligation at the process boundary.
      # Source: https://github.com/BtbN/FFmpeg-Builds (autobuild-2026-07-26-13-28, gpl, non-shared)
      case "$(uname -m)" in
        aarch64|arm64) url="https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-07-26-13-28/ffmpeg-n7.1.5-10-g2aefd64d48-linuxarm64-gpl-7.1.tar.xz"; sha="b803fab318029e530ecd4859013ffbd743a549d0ee4e1bced5e5c3be59bf11e3" ;;
        x86_64) url="https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-07-26-13-28/ffmpeg-n7.1.5-10-g2aefd64d48-linux64-gpl-7.1.tar.xz"; sha="92f7ca590bb4cc17e596c4a9747e3c85d7456fde7bf6e297c48640b471be8f74" ;;
        *) echo "jamstream: no pinned ffmpeg for $(uname -m)" >&2; exit 1 ;;
      esac
      curl -fsSL --retry 5 -o "$tmp/ffmpeg.archive" "$url"
      if ! echo "$sha  $tmp/ffmpeg.archive" | sha256sum -c -; then
        echo "jamstream: ffmpeg sha256 mismatch, refusing to start" >&2
        rm -rf "$tmp"
        exit 1
      fi
      tar -xJf "$tmp/ffmpeg.archive" -C "$tmp" --wildcards --strip-components=2 '*/bin/ffmpeg'
      install -m 0755 "$tmp/ffmpeg" /usr/local/bin/ffmpeg
      rm -f "$tmp/ffmpeg.archive" "$tmp/ffmpeg"
      # mediamtx v1.19.3, MIT. Pinned in data/media_artifacts.json.
      # Source: https://github.com/bluenviron/mediamtx/releases/tag/v1.19.3
      case "$(uname -m)" in
        aarch64|arm64) url="https://github.com/bluenviron/mediamtx/releases/download/v1.19.3/mediamtx_v1.19.3_linux_arm64.tar.gz"; sha="9e5b38a5b5fcab1916341b024031b2fc5dc6a2059baed9ba3f3b0d3768d231a8" ;;
        x86_64) url="https://github.com/bluenviron/mediamtx/releases/download/v1.19.3/mediamtx_v1.19.3_linux_amd64.tar.gz"; sha="a7ba21268fccda3ebc43fdad76b87fddb85ce77e725b5cb637bca724b5394fbe" ;;
        *) echo "jamstream: no pinned mediamtx for $(uname -m)" >&2; exit 1 ;;
      esac
      curl -fsSL --retry 5 -o "$tmp/mediamtx.archive" "$url"
      if ! echo "$sha  $tmp/mediamtx.archive" | sha256sum -c -; then
        echo "jamstream: mediamtx sha256 mismatch, refusing to start" >&2
        rm -rf "$tmp"
        exit 1
      fi
      tar -xzf "$tmp/mediamtx.archive" -C "$tmp" --wildcards 'mediamtx'
      install -m 0755 "$tmp/mediamtx" /usr/local/bin/mediamtx
      rm -f "$tmp/mediamtx.archive" "$tmp/mediamtx"
      rmdir "$tmp" 2>/dev/null || true
      systemctl enable --now mediamtx.service
  - path: /etc/systemd/system/jamstreamd.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=JamStream session server
      After=network-online.target
      Wants=network-online.target

      [Service]
      ExecStart=/usr/local/bin/jamstreamd --config /etc/jamstream/config
      Restart=on-failure
      RestartSec=2

      [Install]
      WantedBy=multi-user.target
  - path: /etc/systemd/system/jamstream-guard.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=JamStream dead man's switch

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/jamstream-guard
  - path: /etc/jamstream/mediamtx.yml
    owner: root:root
    permissions: "0644"
    content: |
      logLevel: warn
      logDestinations: [stdout]
      readTimeout: 10s
      writeTimeout: 10s
      # One RTMP publisher (the encoder) and N local readers (the pushers).
      rtmp: true
      rtmpAddress: 127.0.0.1:1935
      rtmpEncryption: "no"
      rtsp: false
      rtsps: false
      hls: false
      webrtc: false
      srt: false
      api: false
      metrics: false
      pprof: false
      playback: false
      paths:
        jamstream:
          source: publisher
  - path: /etc/systemd/system/mediamtx.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=JamStream broadcast relay (MediaMTX)
      After=network-online.target
      Wants=network-online.target

      [Service]
      ExecStart=/usr/local/bin/mediamtx /etc/jamstream/mediamtx.yml
      Restart=on-failure
      RestartSec=2

      [Install]
      WantedBy=multi-user.target
  - path: /etc/systemd/system/jamstream-guard.timer
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Run the JamStream dead man's switch every minute

      [Timer]
      OnBootSec=2min
      OnUnitActiveSec=1min

      [Install]
      WantedBy=timers.target
runcmd:
  - [/usr/local/sbin/jamstream-bootstrap]
