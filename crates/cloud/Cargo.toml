[package]
name = "jamstream-cloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
reqwest.workspace = true
data-encoding.workspace = true
aws-lc-rs = { workspace = true, optional = true }
flate2.workspace = true

[features]
# GCP launching, which is the only asymmetric crypto in the crate. Default
# on for the CLI and the app; jamstreamd builds without it so aws-lc-sys
# stays out of the musl binaries, where its C does not link for aarch64.
default = ["gcp"]
gcp = ["dep:aws-lc-rs"]

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
proptest.workspace = true
wiremock.workspace = true
flate2.workspace = true
data-encoding.workspace = true
