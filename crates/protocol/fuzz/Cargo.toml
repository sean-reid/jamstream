[package]
name = "jamstream-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
jamstream-protocol = { path = ".." }
# avatar_reassembly drives the session core end to end through
# ServerCore::handle_datagram; avatar_rx_push drives the reassembler and its
# cache directly through the crate's fuzzing feature, which exists for that
# target alone. blake2 lets both announce a content hash they can also
# produce chunks for; without that, everything past the hash check is
# unreachable.
jamstream-session = { path = "../../session", features = ["fuzzing"] }
blake2 = "0.10"
# opus_decode needs the codec wrappers directly. It arrives transitively
# through jamstream-session already; naming it keeps the target honest about
# what it fuzzes.
jamstream-engine = { path = "../../engine" }

[[bin]]
name = "wire_parse"
path = "fuzz_targets/wire_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "invite_decode"
path = "fuzz_targets/invite_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "media_decode"
path = "fuzz_targets/media_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control_receive"
path = "fuzz_targets/control_receive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handshake_read_init"
path = "fuzz_targets/handshake_read_init.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transport_open"
path = "fuzz_targets/transport_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "avatar_reassembly"
path = "fuzz_targets/avatar_reassembly.rs"
test = false
doc = false
bench = false

[[bin]]
name = "opus_decode"
path = "fuzz_targets/opus_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "avatar_rx_push"
path = "fuzz_targets/avatar_rx_push.rs"
test = false
doc = false
bench = false

# The fuzz crate is its own workspace so the root workspace's member list,
# lockfile, and MSRV stay untouched; cargo-fuzz builds it independently on
# nightly with sanitizer flags the main workspace never sees.
[workspace]
members = ["."]

[profile.release]
debug = 1
