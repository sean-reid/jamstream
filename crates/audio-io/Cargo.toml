[package]
name = "jamstream-audio-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
rtrb.workspace = true
hound.workspace = true
# The boundary converter for devices that cannot clock at the session rate
# (#347 rung 3). Same crate and major the engine's drift compensators are
# already written against, so this adds nothing to the dependency graph.
rubato.workspace = true

# The hardware loopback test codes its tone with the session's real Opus
# settings, so a format or scaling bug shows up as a frequency-domain failure
# rather than as plausible-looking samples. Neither crate depends on this one,
# so there is no cycle.
[dev-dependencies]
jamstream-engine.workspace = true
jamstream-protocol.workspace = true
criterion.workspace = true

# test = false keeps `cargo test`/`cargo nextest` from building or running
# this; harness = false hands main() to criterion.
[[bench]]
name = "resample"
harness = false
test = false

# Target-gated so server/wasm builds never pull platform audio stacks.
# macOS: CoreAudio. Windows: WASAPI exclusive mode driven directly through
# the `wasapi` crate, with cpal kept as the shared-mode fallback path (see
# backend() in lib.rs).
[target.'cfg(target_os = "macos")'.dependencies]
cpal.workspace = true
tracing.workspace = true

# wasapi: HEnquist's IAudioClient wrapper, the CamillaDSP precedent, used for
# exclusive-mode streams. windows: MMCSS thread promotion and the AUDCLNT
# HRESULT constants the fallback table keys on; the version matches the one
# wasapi itself depends on so the graph stays single-version.
[target.'cfg(target_os = "windows")'.dependencies]
cpal.workspace = true
tracing.workspace = true
wasapi = "0.23"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Threading",
] }

# Linux gets cpal's native PipeWire host plus dbus-based realtime thread
# promotion, per the pinned stack. Resolver v3 keeps these features from
# leaking into non-Linux builds.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { workspace = true, features = ["pipewire", "realtime-dbus"] }
tracing.workspace = true
