[package]
name = "jamstream-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "jamstreamd"
path = "src/main.rs"

[dependencies]
jamstream-protocol.workspace = true
jamstream-engine.workspace = true
jamstream-session.workspace = true
jamstream-stream.workspace = true
ed25519-dalek.workspace = true
data-encoding.workspace = true
flacenc.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
jamstream-cloud.workspace = true
# The version reject story sends an init claiming a version we do not speak.
jamstream-protocol = { workspace = true, features = ["testing"] }
# The stream integration test scans the bytes a member receives.
postcard.workspace = true
# Recording tests decode the FLAC the recorder wrote with an encoder-
# independent implementation.
claxon.workspace = true
criterion.workspace = true

[[bench]]
name = "flac"
harness = false
