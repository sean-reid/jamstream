[package]
name = "jamstream-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "jamstreamd"
path = "src/main.rs"

[dependencies]
jamstream-protocol.workspace = true
jamstream-engine.workspace = true
jamstream-session.workspace = true
jamstream-stream.workspace = true
# Real dependency, not dev-only: the recorder on a cloud VM streams takes
# to the bucket, so jamstreamd speaks the storage API itself. This puts
# reqwest and its TLS stack into the musl builds; the musl CI job builds
# both architectures and is the gate that decides this is tenable.
# default-features off drops the GCP provider and its RSA signing, which a
# session VM never needs because it launches nothing. Recording to GCS goes
# through the S3 interop endpoint, which needs nothing but SigV4.
jamstream-cloud.workspace = true
ed25519-dalek.workspace = true
data-encoding.workspace = true
flacenc.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
# The version reject story sends an init claiming a version we do not speak.
jamstream-protocol = { workspace = true, features = ["testing"] }
# testing: the socket pump every suite here that joins a real member runs on.
# Not in the dependency above, so jamstreamd links neither it nor tokio's
# presence in that crate.
jamstream-session = { workspace = true, features = ["testing"] }
# testing: the recording tests upload into the in-memory object store. Not in
# the dependency above, so jamstreamd links neither it nor the contract suites.
jamstream-cloud = { workspace = true, features = ["testing"] }
# The stream integration test scans the bytes a member receives.
postcard.workspace = true
# Recording tests decode the FLAC the recorder wrote with an encoder-
# independent implementation.
claxon.workspace = true
criterion.workspace = true

[[bench]]
name = "flac"
harness = false

[build-dependencies]
winresource.workspace = true
