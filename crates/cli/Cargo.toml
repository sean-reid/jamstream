[package]
name = "jamstream-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "jamstream"
path = "src/main.rs"

[dependencies]
jamstream-protocol.workspace = true
jamstream-session.workspace = true
# gcp: this surface launches GCP sessions, so it wants the RSA signing
# jamstreamd does without.
jamstream-cloud = { workspace = true, features = ["gcp"] }

clap.workspace = true
clap_complete.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
data-encoding.workspace = true
hound.workspace = true
thiserror.workspace = true

[dev-dependencies]
jamstream-server.workspace = true
